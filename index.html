<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b6f78">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Solglimt">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:'Grandstander';src:url('grandstander.woff') format('woff');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Nunito';src:url('nunito.woff') format('woff');font-weight:200 1000;font-style:normal;font-display:swap}
</style>
<title>Solglimt Hotel</title>
<meta name="description" content="Et koselig hotellspill: bygg et slitent øyhotell opp til ti stjerner.">
<style>
/* Layout: et spillvindu – HUD-stripe øverst, innrammet "scene" i midten, store faner nederst. Scenene er malte dioramaer. */
:root{
  --ink:#2b2540; --ink-soft:#5f5675; --paper:#fff8ec; --paper-2:#fcebc9; --paper-3:#f6dcab;
  --sand:#f4d79c; --fjord:#2b6f78; --fjord-deep:#1c4c54; --sea:#5fb9c6; --multe:#f2a234; --multe-dark:#b8721a;
  --lingon:#cf4a3e; --lingon-dark:#93302a; --mose:#5c9a47; --mose-dark:#3d6d2e; --plum:#6d4f93; --gold:#f7c948; --white:#ffffff;
  --display:'Grandstander','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:18px; --lift:0 4px 0 rgba(43,37,64,.22);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--fjord);background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.08) 0 18%,transparent 19%),radial-gradient(circle at 85% 80%,rgba(255,255,255,.06) 0 22%,transparent 23%);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding-block:8px;padding-inline:16px;max-width:1120px;margin:0 auto;position:relative}

/* ---------- HUD ---------- */
#hud{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:var(--r);padding:6px 8px 6px 12px;box-shadow:var(--lift);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:900;font-size:19px;color:var(--lingon);letter-spacing:.2px}
.sunlogo{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 50% 70%,var(--gold) 0 38%,var(--multe) 39% 52%,transparent 53%),linear-gradient(transparent 62%,var(--sea) 62% 72%,transparent 72% 78%,var(--sea) 78%);border:2px solid var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--paper-2);border-radius:999px;padding:3px 10px 3px 4px;font-weight:900;font-variant-numeric:tabular-nums;border:2px solid transparent;font-size:14px;white-space:nowrap}
.chip.stars{padding:3px 10px;color:var(--multe-dark);letter-spacing:1px;cursor:pointer;background:var(--paper-3)}
.chip.stars:hover{border-color:var(--multe)}
.chip.clock{padding:3px 10px}
.chip .ic{font-size:15px;width:22px;text-align:center}
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c8 0 18%,var(--gold) 19% 55%,#e09a1d 56%);border:2px solid #a8680f;position:relative;flex:none}
.coin::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1.5px solid rgba(168,104,15,.6)}
.solstar{display:inline-block;width:21px;height:21px;flex:none;background:linear-gradient(135deg,#ffe57a,#f58a5c 70%,#d75a8a);clip-path:polygon(50% 0,61% 34%,98% 36%,68% 58%,79% 95%,50% 73%,21% 95%,32% 58%,2% 36%,39% 34%)}
.tools{display:flex;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:12px;border:0;background:var(--paper-2);font-size:18px;box-shadow:0 3px 0 var(--paper-3)}
.iconbtn:hover{background:var(--paper-3)}
.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.25)}}

/* ---------- STAGE ---------- */
#stage{position:relative;border-radius:24px;overflow:hidden;border:4px solid var(--ink);background:var(--sea);min-height:0;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.scene{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.scene-in{animation:scenein .35s ease-out}
@keyframes scenein{from{opacity:.4;transform:scale(.985)}}

/* ---------- NAV ---------- */
#nav{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:var(--paper);border-radius:var(--r);padding:6px;box-shadow:var(--lift)}
.navbtn{position:relative;border:0;border-radius:14px;background:var(--paper-2);padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--display);font-weight:800;font-size:13px;box-shadow:0 3px 0 var(--paper-3);transition:transform .12s}
.navbtn .ni{font-size:22px;line-height:1.1}
.navbtn:hover{transform:translateY(-2px);background:#fff1d6}
.navbtn.on{background:var(--multe);box-shadow:0 3px 0 var(--multe-dark)}
.badge{position:absolute;top:-5px;right:6px;min-width:20px;height:20px;border-radius:10px;background:var(--lingon);color:var(--white);font-size:12px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--paper);animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}

/* ---------- BUTTONS ---------- */
.btn{border:0;border-radius:14px;padding:.55em 1em;font-family:var(--display);font-weight:800;font-size:15px;background:var(--multe);color:var(--ink);box-shadow:0 4px 0 var(--multe-dark);transition:transform .1s,filter .1s;display:inline-flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--multe-dark)}
.btn.blue{background:var(--fjord);color:var(--white);box-shadow:0 4px 0 var(--fjord-deep)}
.btn.green{background:var(--mose);color:var(--white);box-shadow:0 4px 0 var(--mose-dark)}
.btn.red{background:var(--lingon);color:var(--white);box-shadow:0 4px 0 var(--lingon-dark)}
.btn.soft{background:var(--paper-2);box-shadow:0 4px 0 var(--paper-3)}
.btn.small{font-size:13px;padding:.4em .75em;border-radius:11px}
.btn.big{font-size:22px;padding:.5em 1.4em;border-radius:18px}
.btn[disabled]{filter:grayscale(.8);opacity:.6;cursor:not-allowed;transform:none}

/* ---------- SHEETS ---------- */
#sheet,#game{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(28,30,52,.45);backdrop-filter:blur(2px)}
#game{z-index:50;background:rgba(28,30,52,.65)}
.panel{width:min(760px,100%);max-height:100%;overflow-y:auto;background:var(--paper);border-radius:24px;border:4px solid var(--ink);box-shadow:0 8px 0 rgba(0,0,0,.25);animation:pop .25s ease-out;position:relative}
@keyframes pop{from{transform:scale(.92) translateY(10px);opacity:0}}
.panel-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--paper-2);border-bottom:3px solid var(--paper-3)}
.panel-head h2{font-size:22px;flex:1;min-width:0}
.panel-body{padding:14px;display:grid;gap:14px}
.close{width:38px;height:38px;border-radius:12px;border:0;background:var(--lingon);color:var(--white);font-size:20px;font-weight:900;box-shadow:0 3px 0 var(--lingon-dark)}
.muted{color:var(--ink-soft)}
.label{font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--white);border-radius:16px;border:2px solid var(--paper-3);padding:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bar{height:10px;border-radius:6px;background:var(--paper-3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--mose);border-radius:6px;transition:width .3s}

/* ---------- DIALOG ---------- */
#dialog{position:absolute;left:24px;right:24px;bottom:84px;z-index:45;display:flex;gap:12px;align-items:flex-end;background:var(--paper);border:4px solid var(--ink);border-radius:22px;padding:12px;box-shadow:0 6px 0 rgba(0,0,0,.25);cursor:pointer;animation:pop .2s;max-width:760px;margin:0 auto}
#dialog .av{flex:none;width:76px;height:76px}
.dlg-body{flex:1;min-width:0}
.dlg-name{font-family:var(--display);font-weight:900;color:var(--lingon);font-size:17px}
.dlg-role{font-size:12px;color:var(--ink-soft);font-weight:700;margin-left:6px}
.dlg-text{font-size:16px;line-height:1.45;margin-top:3px;max-width:62ch}
.dlg-next{align-self:center}

/* ---------- TOASTS / FLOATS ---------- */
#toasts{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:60;display:grid;gap:6px;width:min(420px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--paper);border-radius:14px;padding:9px 14px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.25);animation:toast 3.2s forwards}
.toast.good{background:var(--mose)}
.toast.gold{background:var(--multe);color:var(--ink)}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}8%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
.float{position:fixed;z-index:70;pointer-events:none;font-family:var(--display);font-weight:900;font-size:20px;color:var(--multe-dark);text-shadow:0 2px 0 var(--white),0 -1px 0 var(--white),1px 0 0 var(--white),-1px 0 0 var(--white);animation:floatup 1.1s ease-out forwards;white-space:nowrap}
.float.sol{color:#d75a8a}
@keyframes floatup{to{transform:translateY(-60px);opacity:0}}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:80;pointer-events:none;border-radius:3px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- AVATAR ---------- */
.av{display:block}
.npc{position:absolute;border:0;background:none;padding:0;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px;z-index:4;transition:transform .15s}
.npc:hover{transform:translate(-50%,-104%) scale(1.06)}
.npc .av{width:58px;height:58px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
.npc .nm{background:var(--paper);border-radius:999px;padding:1px 8px;font-family:var(--display);font-weight:800;font-size:12px;border:2px solid var(--ink);white-space:nowrap}
.ex{position:absolute;top:-6px;right:-4px;width:20px;height:20px;border-radius:50%;background:var(--gold);border:2px solid var(--ink);font-weight:900;font-size:12px;display:grid;place-items:center;animation:pulse 1.2s infinite}

/* ---------- MAP ---------- */
.map-wrap{padding:14px;display:grid;gap:14px}
.map{position:relative;width:100%;aspect-ratio:100/64;max-width:100%;border-radius:18px;overflow:hidden;border:3px solid var(--fjord-deep)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map.night::after{content:"";position:absolute;inset:0;background:rgba(20,22,60,.42);pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;z-index:2;padding:0}
.pin .pi{width:44px;height:44px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);display:grid;place-items:center;font-size:22px;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .15s}
.pin:hover .pi{transform:translateY(-4px) scale(1.08)}
.pin .pl{background:var(--ink);color:var(--paper);border-radius:999px;padding:1px 8px;font-family:var(--display);font-weight:800;font-size:12px;white-space:nowrap}
.pin.locked .pi{background:#cfc6b8;filter:grayscale(.7)}
.pin.locked .pl{background:#6b6478}
.pin.new .pi{animation:pulse 1.4s infinite}
.area-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.area-card{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:var(--paper);border-radius:16px;padding:10px;box-shadow:var(--lift);transition:transform .12s}
.area-card:hover{transform:translateY(-2px)}
.area-card .ai{font-size:28px;width:44px;height:44px;display:grid;place-items:center;background:var(--paper-2);border-radius:12px;flex:none}
.area-card b{font-family:var(--display);font-size:16px;display:block}
.area-card small{color:var(--ink-soft);font-weight:700}
.area-card.locked{opacity:.65}

/* ---------- SKY / PHASES ---------- */
.sky{background:linear-gradient(#8fd3e8,#dff3f6)}
.ph-morgen .sky,.ph-morgen.sky{background:linear-gradient(#ffcf9e,#bfe6ee 70%)}
.ph-dag .sky,.ph-dag.sky{background:linear-gradient(#7fcbe3,#dcf3f7 75%)}
.ph-kveld .sky,.ph-kveld.sky{background:linear-gradient(#7b5ea7,#f39b6b 75%)}
.ph-natt .sky,.ph-natt.sky{background:radial-gradient(1.5px 1.5px at 12% 20%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 30% 8%,#fff 99%,transparent),radial-gradient(2px 2px at 55% 15%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 72% 30%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 88% 10%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 42% 32%,#fff 99%,transparent),linear-gradient(#141a3d,#3b3f78)}

/* ---------- HOTEL ---------- */
.hotel-scene{display:flex;flex-direction:column}
.hotel-sky{position:relative;padding:14px 14px 0;display:flex;flex-direction:column;align-items:center}
.celestial{position:absolute;top:18px;right:8%;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle,#fff6b0,var(--gold) 60%,#f2a234);box-shadow:0 0 30px 8px rgba(255,214,90,.6)}
.ph-natt .celestial{background:radial-gradient(circle at 35% 40%,#fffbe8,#e9e2c0 70%);box-shadow:0 0 30px 6px rgba(255,255,230,.3)}
.ph-kveld .celestial{top:auto;bottom:30%;background:radial-gradient(circle,#ffe0a0,#f07a4a);}
.cloud{position:absolute;height:22px;border-radius:20px;background:rgba(255,255,255,.85);animation:drift 40s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:30px;height:30px;top:-14px;left:12px}
.cloud::after{width:22px;height:22px;top:-9px;left:36px}
.ph-natt .cloud{opacity:.15}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
.hotel-top{width:100%;max-width:720px;display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;position:relative;z-index:2;margin-bottom:10px}
.pill{background:rgba(255,248,236,.92);border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px;border:2px solid var(--ink)}
.building{width:100%;max-width:720px;position:relative;z-index:2;display:flex;flex-direction:column;align-items:stretch}
.roof{position:relative;height:74px;margin:0 -10px;display:grid;place-items:center}
.roof::before{content:"";position:absolute;inset:0;background:var(--roof,#a85b4a);clip-path:polygon(6% 100%,22% 8%,78% 8%,94% 100%);}
.roof::after{content:"";position:absolute;left:4%;right:4%;bottom:0;height:10px;background:var(--trim,#7a3d33);border-radius:5px}
.sign{position:relative;z-index:1;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:3px 14px;font-family:var(--display);font-weight:900;font-size:clamp(15px,3.6vw,22px);color:var(--lingon);display:flex;flex-direction:column;align-items:center;line-height:1;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.sign small{font-size:13px;color:var(--multe-dark);letter-spacing:2px;margin-top:2px}
.ph-natt .sign,.ph-kveld .sign{box-shadow:0 0 18px 4px rgba(255,214,120,.55)}
.flag{position:absolute;top:-24px;width:4px;height:36px;background:var(--ink);z-index:1}
.flag::after{content:"";position:absolute;left:4px;top:2px;width:22px;height:14px;background:var(--lingon);clip-path:polygon(0 0,100% 50%,0 100%);animation:wave 1.2s ease-in-out infinite alternate;transform-origin:left}
@keyframes wave{to{transform:scaleX(.8) skewY(6deg)}}
.terrace{position:absolute;top:-30px;left:50%;transform:translateX(-50%);display:flex;gap:4px;font-size:18px;z-index:1}
.facade{background:var(--facade,#e7cfa2);border:4px solid var(--ink);border-top:0;border-radius:0 0 12px 12px;padding:10px 10px 0;position:relative}
.facade.cracked{background-image:linear-gradient(115deg,transparent 48%,rgba(90,60,40,.25) 49% 50%,transparent 51%),linear-gradient(65deg,transparent 70%,rgba(90,60,40,.2) 71% 72%,transparent 73%)}
.floor{position:relative;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:stretch;padding-bottom:10px;border-bottom:4px solid var(--trim,#7a3d33);margin-bottom:10px}
.floor-tag{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-weight:800;font-size:12px;background:var(--paper);border-radius:8px;padding:6px 2px;border:2px solid var(--ink);text-align:center}
.rooms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rooms.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.rooms.one{grid-template-columns:minmax(0,1fr)}
.room-card{position:relative;border:3px solid var(--ink);border-radius:12px;padding:0;overflow:hidden;background:#f9e9c6;min-height:108px;display:flex;flex-direction:column;text-align:left;transition:transform .15s}
.room-card:hover{transform:translateY(-3px) rotate(-.5deg)}
.rc-wall{flex:1;position:relative;background:var(--wall,#f5e1b8);min-height:70px}
.lux .rc-wall{--wall:#f7d9e4}
.rc-floor{height:22px;background:repeating-linear-gradient(90deg,#c98d57 0 18px,#b97c48 18px 20px)}
.rc-num{position:absolute;top:12px;left:5px;background:var(--ink);color:var(--paper);font-family:var(--display);font-weight:800;font-size:12px;border-radius:7px;padding:1px 6px;z-index:2}
.rc-view{position:absolute;top:12px;right:5px;font-size:13px;z-index:2}
.rc-items{position:absolute;left:4px;right:4px;bottom:-3px;display:flex;gap:2px;align-items:flex-end;justify-content:center;line-height:0}
.rc-guest{position:absolute;left:50%;top:18px;transform:translateX(-50%);z-index:2}
.rc-guest .av{width:40px;height:40px}
.wishb{position:absolute;top:-2px;right:-26px;background:var(--white);border:2px solid var(--ink);border-radius:12px 12px 12px 2px;font-size:14px;padding:1px 4px;animation:bob 1.6s ease-in-out infinite}
.wishb.ok{background:#d9f2cf}
@keyframes bob{50%{transform:translateY(-3px)}}
.rc-stay{position:absolute;left:6px;right:6px;bottom:26px;height:6px;border-radius:4px;background:rgba(43,37,64,.2);z-index:2}
.rc-stay i{display:block;height:100%;background:var(--fjord);border-radius:4px}
.rc-state{position:absolute;inset:0;display:grid;place-items:center;z-index:3;font-family:var(--display);font-weight:900;font-size:14px;text-align:center}
.rc-state span{max-width:92%;text-align:center;line-height:1.15;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:2px 8px}
.rc-state.ready span{background:var(--gold);animation:pulse 1s infinite}
.rc-state.dirty{background:rgba(120,90,50,.18)}
.rc-state.dirty span{background:var(--lingon);color:var(--white)}
.rc-heart{position:absolute;right:5px;bottom:28px;font-size:11px;font-weight:900;background:var(--paper);border-radius:8px;padding:0 5px;border:1.5px solid var(--ink);z-index:2}
.night-lit .rc-wall{box-shadow:inset 0 0 30px rgba(255,200,90,.55)}
.ph-natt .room-card:not(.night-lit) .rc-wall{filter:brightness(.6)}
.mess-mini{position:absolute;font-size:16px}
.add-floor{width:100%;border:3px dashed rgba(43,37,64,.6);background:rgba(255,248,236,.55);border-radius:14px;padding:10px;font-family:var(--display);font-weight:800;margin-bottom:-4px;display:flex;justify-content:center;gap:8px;align-items:center;position:relative;z-index:2}
.add-floor:hover{background:rgba(255,248,236,.9)}
.ground{display:grid;grid-template-columns:1.4fr 1fr .5fr;gap:8px;padding-bottom:10px}
.lobby{position:relative;background:#fdf1d6;border:3px solid var(--ink);border-radius:12px;min-height:128px;padding:6px;overflow:hidden}
.lobby-title,.resto-title{font-family:var(--display);font-weight:900;font-size:13px;background:var(--fjord);color:var(--white);border-radius:8px;padding:1px 8px;display:inline-block}
.recep-chip{position:absolute;left:58px;bottom:30px;width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);background:#fff8ec;padding:0;overflow:hidden;cursor:pointer;display:grid;place-items:center;font-size:20px;z-index:2}.recep-chip.on{background:#f8e0d6}.recep-chip svg{width:100%;height:100%}
.desk{position:absolute;left:6px;bottom:6px;width:86px;height:34px;background:#b97c48;border:3px solid var(--ink);border-radius:8px 8px 4px 4px}
.lobby .pern{position:absolute;left:47px;bottom:34px;transform:translateX(-50%);border:0;background:none;padding:0}
.lobby .pern .av{width:48px;height:48px}
.queue{position:absolute;left:100px;right:6px;bottom:6px;display:flex;gap:4px;align-items:flex-end;justify-content:flex-start}
.qg{position:relative;border:0;background:none;padding:0;transition:transform .15s;animation:arrive .5s ease-out}
.qg:hover{transform:translateY(-4px)}
.qg .av{width:46px;height:46px}
.qg .wishb{right:-8px;top:-10px}
@keyframes arrive{from{transform:translateX(60px);opacity:0}}
.q-empty{font-size:11px;line-height:1.2;font-weight:700;color:var(--ink-soft);align-self:center;padding-bottom:12px}
.resto{position:relative;border:3px solid var(--ink);border-radius:12px;background:#fde4cf;padding:6px;min-height:128px;display:flex;flex-direction:column;gap:4px;text-align:left;overflow:hidden;transition:transform .15s}
.resto:hover{transform:translateY(-3px)}
.resto .tables{font-size:24px;margin-top:auto}
.resto small{font-weight:800}
.cellar{position:relative;border:3px solid var(--ink);border-radius:12px 12px 4px 4px;background:#8a6a4a;min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:6px 2px;color:var(--white);font-weight:800;font-size:11px;text-align:center;transition:transform .15s}
.cellar:hover{transform:translateY(-3px)}
.cellar .door{width:70%;height:64px;background:repeating-linear-gradient(90deg,#5d4026 0 8px,#6d4b2e 8px 10px);border:3px solid var(--ink);border-radius:20px 20px 2px 2px;display:grid;place-items:center;font-size:18px}
.cellar.open .door{background:#1e1712}
.ground-strip{height:22px;background:linear-gradient(var(--mose),var(--mose-dark));margin:0 -14px;border-top:4px solid var(--ink);position:relative;z-index:1}
.lawn{background:var(--mose);padding:12px 14px 16px;display:grid;gap:10px}
.lawn h3{color:var(--white);font-size:17px}
.fac-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.fac{border:3px solid var(--ink);border-radius:14px;background:var(--paper);padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;transition:transform .15s;min-height:96px;justify-content:center}
.fac:hover{transform:translateY(-3px)}
.fac .fi{font-size:28px}
.fac b{font-family:var(--display);font-size:14px}
.fac small{font-weight:800;font-size:12px;color:var(--ink-soft)}
.fac.plot{background:rgba(255,248,236,.5);border-style:dashed}
.fac.locked{background:rgba(255,248,236,.35);border-style:dashed;opacity:.75}
.fac.built{background:#fff8ec;box-shadow:inset 0 -6px 0 var(--paper-3)}
.upgrade-cta{display:flex;gap:10px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:8px 10px;flex-wrap:wrap}
.upgrade-cta .bar{flex:1;min-width:120px}

/* facade per stjerne */
.st1{--facade:#e3c99c;--roof:#9a6a58;--trim:#6e4a3c}
.st2{--facade:#f6d8a0;--roof:#c4553f;--trim:#8a3a2c}
.st3{--facade:#fbe1ae;--roof:#cf4a3e;--trim:#93302a}
.st4{--facade:#fff0cf;--roof:#2b6f78;--trim:#c79a2a}
.st5{--facade:#fff6e2;--roof:#6d4f93;--trim:#d9a92c}
.st3 .room-card::before{content:"";position:absolute;top:0;left:0;right:0;height:9px;background:repeating-linear-gradient(90deg,var(--lingon) 0 12px,var(--white) 12px 24px);z-index:3;border-bottom:2px solid var(--ink)}
.st4 .room-card::before,.st5 .room-card::before{content:"";position:absolute;top:0;left:0;right:0;height:9px;background:repeating-linear-gradient(90deg,var(--fjord) 0 12px,var(--gold) 12px 24px);z-index:3;border-bottom:2px solid var(--ink)}
.st2 .room-card::after,.st3 .room-card::after,.st4 .room-card::after,.st5 .room-card::after{content:"🌷🌼🌷";position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:10px;letter-spacing:-1px;z-index:3;background:#7a4e2c;line-height:14px;height:14px;border-top:2px solid var(--ink)}

/* ---------- AREA SCENES ---------- */
.area{display:flex;flex-direction:column}
.scape{position:relative;height:clamp(230px,44vh,380px);overflow:hidden;flex:none}
.scape .ground{position:absolute;left:-5%;right:-5%;bottom:0;height:42%;border-radius:50% 50% 0 0/18% 18% 0 0;display:block;padding:0}
.scape .water{position:absolute;left:0;right:0;background:linear-gradient(#5fb9c6,#2f8b98)}
.scape .water::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(170deg,transparent 0 14px,rgba(255,255,255,.18) 14px 16px);animation:shimmer 6s linear infinite}
@keyframes shimmer{to{background-position:60px 0}}
.prop{position:absolute;transform:translate(-50%,-100%);font-size:var(--s,40px);line-height:1;border:0;background:none;padding:0;filter:drop-shadow(0 4px 0 rgba(0,0,0,.18));z-index:2}
button.prop{cursor:pointer;transition:transform .15s}
button.prop:hover{transform:translate(-50%,-104%) scale(1.08)}
.prop.shy{opacity:.5;filter:none}
.prop.shy:hover{opacity:.9}
.scape.night::after{content:"";position:absolute;inset:0;background:rgba(18,20,58,.45);pointer-events:none;z-index:3}
.scape.night .glow{filter:drop-shadow(0 0 14px #ffd36a) drop-shadow(0 0 4px #ffd36a);z-index:5}
.scape.night .npc{z-index:5}
.area-title{position:absolute;left:12px;top:12px;z-index:6;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:4px 12px;font-family:var(--display);font-weight:900;font-size:18px;display:flex;gap:6px;align-items:center}
.back{position:absolute;right:12px;top:12px;z-index:6}
.area-body{background:var(--paper);padding:14px;display:grid;gap:12px;flex:1;border-top:4px solid var(--ink)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.act{display:flex;gap:10px;align-items:center;background:var(--white);border:2px solid var(--paper-3);border-radius:16px;padding:10px}
.act .ai{font-size:30px;flex:none;width:46px;text-align:center}
.act .tx{flex:1;min-width:0}
.act b{font-family:var(--display);font-size:15px;display:block}
.act small{color:var(--ink-soft);font-weight:700;display:block}
.dock{position:absolute;left:8%;width:46%;bottom:30%;height:16px;background:repeating-linear-gradient(90deg,#9b6a3e 0 22px,#86592f 22px 24px);border:3px solid var(--ink);border-radius:4px;z-index:1}
.fence{position:absolute;left:0;right:0;bottom:36%;height:20px;background:repeating-linear-gradient(90deg,transparent 0 22px,#f7f0e0 22px 28px),linear-gradient(transparent 6px,#f7f0e0 6px 9px,transparent 9px 13px,#f7f0e0 13px 16px,transparent 16px);z-index:1}

/* animals */
.animals{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.animal{background:var(--white);border:2px solid var(--paper-3);border-radius:16px;padding:10px;display:grid;gap:6px}
.animal .top{display:flex;gap:10px;align-items:center}
.animal .ae{font-size:40px;width:56px;height:56px;display:grid;place-items:center;background:var(--paper-2);border-radius:14px}
.animal.happy .ae{animation:hop 1.4s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-6px)}}
.need{display:grid;grid-template-columns:44px 1fr;gap:6px;align-items:center;font-size:12px;font-weight:800}
.need .bar{height:8px}
.need .bar i{background:var(--multe)}

/* ---------- ROOM VIEW ---------- */
.rv{position:relative;width:100%;aspect-ratio:16/10;max-width:100%;border:4px solid var(--ink);border-radius:18px;overflow:hidden;background:#f5e1b8}
.rv.lux{background:#f6d6e2}
.rv-wall{position:absolute;inset:0 0 34% 0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 26px,transparent 26px 52px)}
.rv-floor{position:absolute;left:0;right:0;bottom:0;height:34%;background:repeating-linear-gradient(90deg,#c98d57 0 40px,#b97c48 40px 43px);border-top:4px solid #8a5a33}
.rv-win{position:absolute;left:50%;top:10%;width:24%;height:40%;border:5px solid #fff;outline:3px solid var(--ink);border-radius:8px;overflow:hidden}
.rv-win.hav{background:linear-gradient(#a6dff0 0 55%,#3f9fb0 55%)}
.rv-win.hage{background:linear-gradient(#a6dff0 0 50%,#7cbf5a 50%)}
.rv-win::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;background:#fff;transform:translateX(-50%)}
.rv-win span{position:absolute;left:18%;top:36%;font-size:clamp(12px,2.6vw,20px)}
.ph-natt .rv-win.hav,.ph-natt .rv-win.hage{filter:brightness(.45) saturate(.8)}
.rv-win{left:44%;width:22%}
.rv-bath{position:absolute;right:2%;top:5%;width:22%;height:56%;background:repeating-linear-gradient(0deg,#dff1f4 0 14px,#bfe2e8 14px 15px),#dff1f4;background-image:repeating-linear-gradient(0deg,transparent 0 14px,#a9d3db 14px 15px),repeating-linear-gradient(90deg,transparent 0 14px,#a9d3db 14px 15px);border:3px solid var(--ink);border-radius:14px 14px 0 0;border-bottom:6px solid #9aa6b2}
.rv-shelf{position:absolute;left:27%;top:33%;width:14%;height:2.4%;background:#a87747;border:2px solid var(--ink);border-radius:3px}
.slot{position:absolute;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;z-index:2;transition:transform .15s}
.slot .si{display:block;width:100%;line-height:0}
.slot .fa{display:block;width:100%;height:auto;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12))}
.slot.empty .si{width:clamp(30px,6vw,50px);height:clamp(30px,6vw,50px);border:3px dashed rgba(43,37,64,.45);border-radius:12px;display:grid;place-items:center;font-size:20px;line-height:1;color:rgba(43,37,64,.6);background:rgba(255,255,255,.4);margin:0 auto}
.slot .sl{position:absolute;bottom:-4px;left:50%;transform:translate(-50%,100%);font-size:11px;font-weight:900;background:var(--paper);border-radius:6px;padding:0 5px;border:1.5px solid var(--ink);opacity:0;transition:opacity .15s;white-space:nowrap;line-height:1.5}
.slot.empty .sl{position:static;transform:none;margin-top:2px}
.slot:hover{transform:translateY(-3px)}
.slot:hover .sl,.slot.sel .sl,.slot.empty .sl{opacity:1}
.slot.sel .si{outline:3px solid var(--gold);outline-offset:3px;border-radius:12px}
.s-seng{left:2%;bottom:4%;width:35%}
.s-nattbord{left:37%;bottom:6%;width:11%}
.s-lampe{left:38%;bottom:17%;width:8%}
.s-teppe{left:40%;bottom:1%;width:27%;z-index:1}
.s-bilde{left:6%;top:7%;width:17%}
.s-deko{left:29%;bottom:66.5%;width:10%}
.s-plante{right:2%;bottom:5%;width:11%}
.s-mobel{right:15%;bottom:4%;width:19%}
.s-bad{right:3%;bottom:39.5%;width:20%}
.s-plante.empty,.s-mobel.empty{bottom:8%}
.rc-items .mini{display:block;height:clamp(14px,2.8vw,22px)}
.rc-items .mini .fa{height:100%;width:auto;display:block}
.rc-items .m-seng{height:clamp(22px,4.4vw,34px)}
.rc-items .m-mobel,.rc-items .m-bad{height:clamp(16px,3.2vw,26px)}
.pick-row .pi{width:64px;height:48px;display:grid;place-items:end center}
.pick-row .pi .fa{width:100%;height:100%;display:block}
.furn-item .ce{width:100%;height:64px;display:grid;place-items:end center}
.furn-item .ce .fa{width:auto;max-width:90%;height:100%}
.rv-guest{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);z-index:3}
.rv-guest .av{width:clamp(48px,11vw,80px);height:clamp(48px,11vw,80px)}
.mess{position:absolute;border:0;background:none;padding:0;font-size:clamp(24px,5vw,40px);z-index:4;transform:translate(-50%,-50%) rotate(var(--rot,0deg));transition:transform .15s;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
.mess:hover{transform:translate(-50%,-50%) scale(1.2)}
.poof{position:fixed;z-index:70;pointer-events:none;font-size:28px;animation:poof .5s forwards}
@keyframes poof{to{transform:scale(2);opacity:0}}
.picker{display:grid;gap:8px}
.pick-row{display:flex;align-items:center;gap:10px;background:var(--white);border:2px solid var(--paper-3);border-radius:14px;padding:8px 10px}
.pick-row .pi{font-size:30px;width:40px;text-align:center;flex:none}
.pick-row .tx{flex:1;min-width:0}
.pick-row b{font-family:var(--display)}
.pick-row small{display:block;color:var(--ink-soft);font-weight:700}
.pick-row.locked{opacity:.55}
.guest-box{display:flex;gap:12px;align-items:center;background:var(--white);border:2px solid var(--paper-3);border-radius:16px;padding:10px;flex-wrap:wrap}
.guest-box .av{width:64px;height:64px;flex:none}
.quote{font-style:italic;font-weight:700}
.tag{display:inline-block;background:var(--paper-2);border-radius:999px;padding:1px 9px;font-weight:800;font-size:12px}
.tag.ok{background:#d9f2cf;color:#2d5d22}
.tag.no{background:#fbd9d4;color:var(--lingon-dark)}

/* ---------- QUESTS / COLLECTIONS ---------- */
.quest{display:flex;gap:12px;align-items:center;background:var(--white);border:2px solid var(--paper-3);border-radius:16px;padding:10px 12px}
.quest .qi{font-size:26px;flex:none}
.quest .tx{flex:1;min-width:0}
.quest b{font-family:var(--display);font-size:16px}
.quest.ready{border-color:var(--gold);background:#fff7d6}
.quest.main{border-width:3px;border-color:var(--multe)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs .btn{font-size:13px}
.col-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.col-item{background:var(--white);border:2px solid var(--paper-3);border-radius:14px;padding:8px 4px;text-align:center;font-size:12px;font-weight:800;display:grid;gap:2px;justify-items:center}
.col-item .ce{font-size:32px;line-height:1.1}
.col-item.missing .ce{filter:brightness(0) opacity(.18)}
.col-item.missing{color:var(--ink-soft)}
.postcard{width:64px;height:44px;border-radius:6px;border:2px solid var(--ink);display:grid;place-items:center;font-size:22px;background:var(--pc,#5fb9c6);box-shadow:2px 2px 0 rgba(0,0,0,.2)}

/* ---------- MINIGAMES ---------- */
.game-panel{width:min(640px,100%)}
.mg-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mg{display:grid;grid-template-columns:auto 1fr;gap:10px;background:var(--white);border:2px solid var(--paper-3);border-radius:16px;padding:10px;align-items:center}
.mg .mi{font-size:36px;width:56px;height:56px;border-radius:14px;background:var(--paper-2);display:grid;place-items:center}
.mg b{font-family:var(--display);font-size:16px}
.mg small{display:block;color:var(--ink-soft);font-weight:700}
.medal{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:900;border:2px solid var(--ink);vertical-align:middle}
.medal.bronse{background:#d99a62}.medal.solv{background:#d7dde3}.medal.gull{background:var(--gold)}.medal.ingen{background:var(--paper-3);opacity:.6}
.gstage{display:grid;gap:12px;justify-items:center;text-align:center}
.ginfo{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ginfo span{background:var(--paper-2);border-radius:999px;padding:3px 12px;font-weight:800;font-variant-numeric:tabular-nums}
.pan{position:relative;width:min(240px,64vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#4d4b55 0 62%,#2d2b33 63%);border:6px solid #1c1b20;display:grid;place-items:center;margin-right:40px}
.pan-handle{position:absolute;right:-70px;top:46%;width:80px;height:18px;background:#1c1b20;border-radius:0 10px 10px 0}
.pancake{width:72%;aspect-ratio:1;border-radius:50%;background:#f7ecc4;box-shadow:inset 0 -6px 10px rgba(0,0,0,.15),0 4px 0 rgba(0,0,0,.25);transition:background .1s}
.pancake.flip{animation:flip .45s ease-in-out}
@keyframes flip{50%{transform:translateY(-70px) rotateX(180deg) scale(.9)}}
.meter{position:relative;width:min(360px,90%);height:22px;border-radius:12px;border:3px solid var(--ink);background:linear-gradient(90deg,#f7ecc4,#f3cf7a 45%,#e9a33a 66%,#b0642a 84%,#4a2f1f)}
.meter .zone{position:absolute;left:58%;width:16%;top:-3px;bottom:-3px;border:3px solid var(--mose);border-radius:6px;background:rgba(92,154,71,.2)}
.meter .needle{position:absolute;top:-8px;width:6px;height:32px;background:var(--ink);border-radius:3px;transform:translateX(-50%)}
.gmsg{font-family:var(--display);font-weight:800;font-size:18px;min-height:1.3em}
.suitcase{width:150px;height:110px;border-radius:18px;border:4px solid var(--ink);position:relative;display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.2);margin-top:20px;animation:pop .2s}
.suitcase::before{content:"";position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:54px;height:22px;border:5px solid var(--ink);border-bottom:0;border-radius:12px 12px 0 0}
.suitcase .stag{background:var(--white);border:3px solid var(--ink);border-radius:8px;padding:2px 10px;font-family:var(--display);font-weight:900;font-size:26px}
.doorbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:420px}
.doorbtn{border:4px solid var(--ink);border-radius:14px 14px 4px 4px;padding:14px 4px;font-family:var(--display);font-weight:900;font-size:20px;color:var(--white);text-shadow:0 2px 0 rgba(0,0,0,.35);box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .1s}
.doorbtn:hover{transform:translateY(-3px)}
.flash-good{animation:fg .35s}
.flash-bad{animation:fb .35s}
@keyframes fg{50%{box-shadow:0 0 0 8px rgba(92,154,71,.6)}}
@keyframes fb{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.sandgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;width:min(420px,100%);background:#e8c37a;padding:8px;border-radius:18px;border:4px solid var(--ink)}
.sand{aspect-ratio:1;border:0;border-radius:10px;background:radial-gradient(circle at 30% 30%,#f9e3b0,#efcf8b);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08);font-size:clamp(18px,5vw,28px);display:grid;place-items:center;font-weight:900;color:#9a6a2c;transition:transform .1s}
.sand:hover:not(.dug){transform:scale(1.06)}
.sand.dug{background:#d9ad62;box-shadow:inset 0 4px 6px rgba(0,0,0,.15);cursor:default}
.sand.ghost{opacity:.45}
.pond{position:relative;width:min(420px,100%);height:220px;border-radius:20px;border:4px solid var(--ink);background:linear-gradient(#bfe6ee 0 22%,#4aa6b4 22%,#2f7f8c);overflow:hidden;cursor:pointer}
.pond .line{position:absolute;left:50%;top:0;width:2px;height:96px;background:rgba(43,37,64,.6)}
.bobber{position:absolute;left:50%;top:84px;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:linear-gradient(var(--lingon) 50%,var(--white) 50%);border:3px solid var(--ink);animation:bob 1.2s ease-in-out infinite}
.bobber.bite{animation:dip .25s ease-in-out infinite;box-shadow:0 0 0 10px rgba(255,255,255,.35)}
@keyframes dip{50%{transform:translate(-50%,14px)}}
.ripple{position:absolute;left:50%;top:104px;width:60px;height:14px;transform:translateX(-50%);border:2px solid rgba(255,255,255,.6);border-radius:50%}
.catch{position:absolute;left:50%;top:40px;transform:translateX(-50%);font-size:46px;animation:pop .3s}
.result{display:grid;gap:10px;justify-items:center;text-align:center}
.bigmedal{width:110px;height:110px;border-radius:50%;border:5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:18px;box-shadow:0 6px 0 rgba(0,0,0,.25);animation:pop .4s}
.wheel{width:220px;height:220px;border-radius:50%;border:5px solid var(--ink);background:conic-gradient(var(--multe) 0 45deg,var(--sea) 45deg 90deg,var(--lingon) 90deg 135deg,var(--mose) 135deg 180deg,var(--gold) 180deg 225deg,var(--plum) 225deg 270deg,var(--multe) 270deg 315deg,var(--fjord) 315deg);transition:transform 3s cubic-bezier(.2,.8,.2,1);position:relative}
.wheel-wrap{position:relative;display:grid;justify-items:center}
.wheel-wrap::before{content:"";position:absolute;top:-6px;z-index:2;border:12px solid transparent;border-top:20px solid var(--ink)}
.diary{background:#f3e3c0;border:3px solid #7a5530;border-radius:10px;padding:16px;font-family:var(--display);font-size:16px;line-height:1.5;box-shadow:inset 0 0 30px rgba(120,80,30,.25)}
.diary p+p{margin-top:10px}
.diary .date{font-size:13px;color:#7a5530;font-weight:800}

/* ---------- RENGJØRING ---------- */
.clean-opts{display:grid;gap:8px}
.clean-opt{display:flex;align-items:center;gap:10px;background:var(--white);border:2px solid var(--paper-3);border-radius:14px;padding:10px 12px}
.clean-opt .co-ic{font-size:28px;flex:none;width:36px;text-align:center}
.clean-opt .co-tx{flex:1;min-width:0}
.clean-opt b{font-family:var(--display);font-size:16px;display:block}
.clean-opt small{display:block;color:var(--ink-soft);font-weight:700;line-height:1.35}
.clean-opt .btn{flex:none;min-height:40px}
.floor-clean{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(255,248,236,.92);border:2px solid var(--ink);border-radius:12px;padding:5px 8px}
.floor-clean .fc-ic{font-size:18px}
.floor-clean .fc-tx{font-weight:800;font-size:13px;flex:1;min-width:120px}
.floor-clean .fc-bar{flex:1 1 120px;height:10px;border-radius:6px;background:var(--paper-3);overflow:hidden}
.floor-clean .fc-bar i{display:block;height:100%;background:var(--fjord);transition:width .4s}
.floor-clean.busy{border-color:var(--fjord)}
.rc-state .cleaning{animation:pulse 1s infinite;background:var(--sea);color:var(--ink)}
@media (max-width:480px){.clean-opt{flex-wrap:wrap}.clean-opt .btn{width:100%}}
/* ---------- LOBBY ---------- */
.lobby-scene{display:flex;flex-direction:column;background:#2b2540}
.lobby-wrap{position:relative;flex:none;display:grid;place-items:center;background:#2b2540}
.lobby-svg{display:block;width:100%;height:auto;max-height:66vh;max-width:100%;overflow:hidden}
.hot{cursor:pointer;transition:filter .15s}
.hot:hover{filter:brightness(1.08) drop-shadow(0 0 6px rgba(255,240,190,.95))}
.ringing{animation:ring .45s infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.look-cap{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:10px;align-items:center;background:rgba(255,248,236,.97);border:3px solid var(--ink);border-radius:16px;padding:8px 12px;box-shadow:0 4px 0 rgba(0,0,0,.25);max-width:640px;margin:0 auto;cursor:pointer}
.look-cap p{font-weight:700;line-height:1.4;font-size:15px;max-width:62ch}
.lc-av{width:44px;flex:none}
.lc-in{animation:pop .2s}
.lobby-ui{background:var(--paper);padding:12px 14px;display:grid;gap:10px;flex:1;align-content:start;border-top:4px solid var(--ink)}
.lobby-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lb-title{font-family:var(--display);font-size:18px}
.lb-hint{font-weight:700;flex:1;min-width:160px;font-size:13px}
.lq-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.lq{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--paper-3);background:var(--white);border-radius:14px;padding:8px 10px;min-height:58px;transition:transform .12s}
.lq:hover{transform:translateY(-2px)}
.lq-av{width:44px;flex:none}
.lq-tx{min-width:0}.lq-tx b{font-family:var(--display);display:block}.lq-tx small{display:block;color:var(--ink-soft);font-weight:700}
.lq-empty{font-weight:700}
.enter-lobby{position:absolute;top:6px;right:6px;z-index:3}
/* ---------- LANGSIKTIG: DAGLIG + SJØFLØYEN ---------- */
.daily{display:grid;gap:8px;border-color:var(--multe);background:#fffaf0}
.daily-list{display:grid;gap:6px}
.daily-row{display:flex;gap:10px;align-items:center;background:var(--white);border:2px solid var(--paper-3);border-radius:12px;padding:6px 10px}
.daily-row.got{opacity:.65}
.dr-ic{font-size:22px;width:28px;text-align:center}.dr-tx{flex:1;min-width:0}.dr-tx b{display:block;font-size:14px}.dr-tx .bar{height:8px;margin-top:4px}
.week{display:flex;gap:6px;justify-content:center}
.wd{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px;background:var(--paper-2);border:2px solid var(--paper-3);color:var(--ink-soft)}
.wd.on{background:var(--gold);border-color:var(--multe-dark);color:var(--ink)}.wd.today{outline:2px solid var(--fjord);outline-offset:1px}
.wing-wrap{border:3px solid var(--ink);border-radius:16px;overflow:hidden;line-height:0;background:#8cc86a}
.wing-svg{display:block;width:100%;height:auto}
.wing-rooms{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.wing-tag{border:2px solid var(--ink);cursor:pointer}
.building.gold .sign{border-color:#d9a92c;box-shadow:0 0 0 3px #f7c948,0 3px 0 rgba(0,0,0,.2)}
.flagwave{animation:wave 1.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left}
/* ---------- TEGNEDE OMRÅDER ---------- */
.scape-art{position:relative;background:#2b2540;border-bottom:4px solid var(--ink);line-height:0}
.area-svg{display:block;width:100%;aspect-ratio:800/420;height:auto;max-height:58vh}
@media (max-width:640px){.area-svg{aspect-ratio:800/480}}
.area-body{align-content:start}
.scape-art .area-title,.scape-art .back,.scape-art .look-cap{line-height:normal}
.wheel-spin,.cabin{animation:spin 40s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.bob-slow{animation:bob 3s ease-in-out infinite}
.crab{animation:crab 4s ease-in-out infinite}@keyframes crab{50%{transform:translateX(24px)}}
.bee{animation:bee 3s ease-in-out infinite}@keyframes bee{25%{transform:translate(14px,-8px)}75%{transform:translate(-12px,6px)}}
.balloon{animation:bob 3s ease-in-out infinite}
.twinkle{animation:bulb 1.8s ease-in-out infinite}
.zzz{animation:bob 2s ease-in-out infinite}
.wag{animation:wag .5s ease-in-out infinite;transform-box:fill-box;transform-origin:right bottom}@keyframes wag{50%{transform:rotate(-14deg)}}
.happy-animal{animation:hop 1.6s ease-in-out infinite}
.squirrel{animation:hop 2.2s ease-in-out infinite}
.fountain{animation:fountain 1.2s ease-in-out infinite}@keyframes fountain{50%{opacity:.6}}
/* ---------- MÅKESKJÆR ---------- */
.bt-prog{position:relative;width:min(360px,100%);height:14px;border-radius:7px;background:var(--paper-3);border:2px solid var(--ink)}
.bt-prog i{display:block;height:100%;border-radius:5px;background:var(--fjord);transition:width .1s}
.bt-prog span{position:absolute;right:-6px;top:-12px;font-size:20px}
.bt-sea{position:relative;width:min(360px,100%);height:min(48vh,360px);border-radius:16px;border:4px solid var(--ink);overflow:hidden;background:linear-gradient(#5fb9c6,#2f8b98);touch-action:manipulation}
.bt-sea::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(170deg,transparent 0 22px,rgba(255,255,255,.14) 22px 24px);animation:seamove 1.2s linear infinite}
@keyframes seamove{to{background-position:0 48px}}
.bt-lane{position:absolute;top:0;bottom:0;border-left:2px dashed rgba(255,255,255,.2)}
.bt-boat{position:absolute;bottom:14px;transform:translateX(-50%);font-size:44px;line-height:1;transition:left .12s ease-out;z-index:2}
.bt-ola{position:absolute;left:12px;top:-18px;width:30px}
.bt-obj{position:absolute;top:0;left:0;font-size:34px;line-height:1;will-change:transform}
.bt-obj.got{animation:poof .3s forwards}.bt-obj.hit{opacity:.4}
.beacon{animation:beacon 2.4s steps(1) infinite}
@keyframes beacon{0%,10%,20%{fill:#fff7c0}5%,15%{fill:#ffd36a}25%,100%{fill:#ffe27a}}
.beam{animation:beam 4s ease-in-out infinite;transform-origin:640px 45px}
@keyframes beam{50%{transform:scaleX(-1)}}
.smoke{animation:smoke 3s ease-in-out infinite}@keyframes smoke{50%{transform:translateY(-6px);opacity:.4}}
.sparkle{animation:pulse 1.2s infinite;transform-box:fill-box;transform-origin:center}
.gull{animation:bob 2s ease-in-out infinite}
.flame{animation:bob .6s ease-in-out infinite}
.oldphoto{display:inline-grid;place-items:center;width:52px;height:42px;background:#f3e3c0;border:3px solid #fff8ec;outline:2px solid #7a5530;box-shadow:2px 2px 0 rgba(0,0,0,.2);filter:sepia(.9) saturate(.8);font-size:24px;transform:rotate(-3deg)}
/* ---------- NYE MINISPILL ---------- */
.codebox{width:100%;margin-top:6px;font:12px/1.4 ui-monospace,Menlo,monospace;border:2px solid var(--paper-3);border-radius:10px;padding:8px;background:var(--white);color:var(--ink);resize:vertical;word-break:break-all}
.ck-order{display:flex;gap:12px;align-items:center;background:var(--white);border:3px solid var(--ink);border-radius:16px;padding:8px 14px;min-width:min(320px,100%)}
.ck-dish{font-size:48px}
.ck-order b{font-family:var(--display);font-size:18px}
.ck-recipe{display:flex;gap:6px;margin-top:4px}
.ck-chip{width:40px;height:40px;border-radius:10px;border:2px dashed var(--ink-soft);display:grid;place-items:center;font-size:24px;background:var(--paper-2)}
.ck-chip.ok{border:2px solid var(--mose);background:#d9f2cf}
.ck-chip.hid{font-size:0}.ck-chip.hid::after{content:"?";font-size:20px;font-weight:900;color:var(--ink-soft)}
.ck-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:min(440px,100%)}
.ck-ing{border:3px solid var(--ink);border-radius:14px;background:var(--white);padding:6px 2px;display:grid;justify-items:center;box-shadow:0 3px 0 rgba(0,0,0,.18);min-height:64px}
.ck-ing span{font-size:30px;line-height:1.1}.ck-ing small{font-weight:800;font-size:11px}
.td-list{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.td-want{width:38px;height:38px;border-radius:10px;background:var(--paper-2);border:2px solid var(--ink);display:grid;place-items:center;font-size:22px}
.td-want.ok{background:#d9f2cf;opacity:.5;text-decoration:line-through}
.td-room{position:relative;width:min(520px,100%);aspect-ratio:16/10;border:4px solid var(--ink);border-radius:16px;overflow:hidden;background:#f5e1b8}
.td-wall{position:absolute;inset:0 0 32% 0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.2) 0 26px,transparent 26px 52px)}
.td-floor{position:absolute;left:0;right:0;bottom:0;height:32%;background:repeating-linear-gradient(90deg,#c98d57 0 40px,#b97c48 40px 43px);border-top:4px solid #8a5a33}
.td-f{position:absolute;line-height:0;pointer-events:none}.td-f .fa{width:100%;height:auto}
.td-item{position:absolute;transform:translate(-50%,-50%) rotate(var(--rot));border:0;background:none;padding:4px;line-height:1;z-index:2;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.td-item.gone{animation:poof .4s forwards;pointer-events:none}
.dp-pen{position:relative;width:min(340px,100%);height:180px;border-radius:18px;border:4px solid var(--ink);background:linear-gradient(#bfe6ee 0 45%,#8cc86a 45%);display:grid;place-items:center}
.dp-animal{font-size:84px;line-height:1;margin-top:30px}
.dp-animal.happy{animation:hop .35s ease-out 2}
.dp-bubble{position:absolute;top:10px;right:12px;background:var(--white);border:3px solid var(--ink);border-radius:16px 16px 16px 4px;padding:4px 10px;font-size:26px;display:flex;gap:6px;align-items:center}
.dp-bubble small{font-size:13px;font-weight:800}
.dp-pat{position:absolute;left:12px;right:12px;bottom:8px;height:8px;border-radius:4px;background:rgba(43,37,64,.2)}.dp-pat i{display:block;height:100%;border-radius:4px;background:var(--multe)}
.dp-tray{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;width:min(480px,100%)}
.dp-item{border:3px solid var(--ink);border-radius:12px;background:var(--white);padding:4px 0;display:grid;justify-items:center;min-height:58px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.dp-item span{font-size:26px}.dp-item small{font-size:10px;font-weight:800}
@media (max-width:420px){.dp-tray{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ds-floor{position:relative;width:min(360px,100%);height:min(46vh,340px);border-radius:16px;border:4px solid var(--ink);overflow:hidden;background:linear-gradient(#2b2540,#4a3566);transition:background .1s}
.ds-floor.pulse{background:linear-gradient(#352d50,#5a4278)}
.ds-lane{position:absolute;top:0;bottom:0;width:25%;border-right:2px dashed rgba(255,255,255,.12)}
.ds-hit{position:absolute;left:0;right:0;top:86%;height:6px;margin-top:-3px;background:#fff8ec;opacity:.8;border-radius:3px}
.ds-ball{position:absolute;right:8px;top:4px;font-size:26px;animation:bob 1s ease-in-out infinite}
.ds-note{position:absolute;top:0;width:19%;height:22px;margin-top:-11px;border-radius:11px;border:3px solid #fff8ec;box-shadow:0 0 12px rgba(255,255,255,.4);will-change:transform}
.ds-note.pop{animation:poof .25s forwards}.ds-note.missed{opacity:.25}
.ds-pads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:min(360px,100%)}
.ds-pad{border:3px solid var(--ink);border-radius:14px;color:#fff;font-size:24px;font-weight:900;min-height:64px;box-shadow:0 4px 0 rgba(0,0,0,.3);touch-action:manipulation}
.ds-pad.pressed{animation:padp .15s}
@keyframes padp{50%{transform:translateY(3px) scale(.96);filter:brightness(1.3)}}
/* ---------- HOTELLHAGEN ---------- */
.garden{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.garden-svg{display:block;width:100%;height:auto;border-radius:16px;border:3px solid var(--ink);background:#8cc86a}
@media (max-width:640px){.garden{grid-template-columns:1fr}}
.fac.building{background:#fff3d6;border-style:solid}
.wave{animation:wave2 3s ease-in-out infinite}
@keyframes wave2{50%{transform:translateX(10px)}}
.swimmer{animation:swim 2.4s ease-in-out infinite}
@keyframes swim{50%{transform:translate(8px,-2px)}}
.bulb{animation:bulb 1.2s steps(2) infinite}
@keyframes bulb{50%{opacity:.4}}
.film{animation:bob 2s ease-in-out infinite}
/* ---------- GJESTEBOK ---------- */
.toast.review{animation-duration:6s;font-weight:700}
.toast.review .rt-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.toast.review .rt-head b{font-family:var(--display);font-size:15px}
.toast.review .rt-pay{margin-left:auto;font-variant-numeric:tabular-nums}
.toast.review p{margin-top:2px;font-weight:700;font-size:14px;line-height:1.35}
.thought{margin-top:6px;font-weight:700;font-size:14px;padding:6px 10px;border-radius:12px;display:inline-block}
.thought.pos{background:#e3f4da;color:#2d5d22}.thought.neg{background:#fde6d8;color:#8a3a20}
.gb-sum{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:stretch}
.gb-sum>div{background:var(--white);border:2px solid var(--paper-3);border-radius:14px;padding:10px 12px}
.gb-big{font-family:var(--display);font-weight:900;font-size:28px;color:var(--multe-dark);font-variant-numeric:tabular-nums}
.gb-tip p{font-weight:700;margin-top:2px}
.gb-list{display:grid;gap:8px}
.gb-entry{display:flex;gap:10px;background:#fffdf6;border:2px solid var(--paper-3);border-radius:14px;padding:10px 12px;background-image:repeating-linear-gradient(transparent 0 23px,rgba(43,111,120,.08) 23px 24px)}
.gb-av{width:44px;flex:none}
.gb-tx{flex:1;min-width:0}
.gb-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.gb-head b{font-family:var(--display);font-size:16px}
.gb-stars{color:var(--multe-dark);letter-spacing:1px}
.gb-line{font-weight:700;margin-top:3px;max-width:62ch}.gb-line.neg{color:#8a3a20}
@media (max-width:480px){.gb-sum{grid-template-columns:1fr}}

/* ---- mer å gjøre: basseng, kino, kjeller, bowling, lyktefest ---- */

.fac-acts .row{gap:6px;flex-wrap:wrap}

.balloon{animation:balloon 3s ease-in-out infinite;transform-box:fill-box}
@keyframes balloon{50%{transform:translateY(-8px)}}
.twinkle{animation:twinkle 2s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.25}}

<script>
'use strict';
/* =========================================================
   SOLGLIMT HOTEL – et koselig hotellspill
   Arkitektur: én tilstand (S), datatabeller (FURN, GTYPES, FAC, AREAS, GAMES, NPCS, QUESTS),
   scener (kart/hotell/restaurant/område), "sheets" (paneler), og minispill-moduler.
   Nye områder: legg til i AREAS + AREA_SCENES. Nye minispill: legg til i GAMES med start().
   ========================================================= */
const SAVE_KEY='solglimt-hotel-v1';
const $=(s,el=document)=>el.querySelector(s);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const starStr=(n,max=5)=>'★'.repeat(n)+'☆'.repeat(Math.max(0,max-n));

/* ---------------- DATA: MØBLER ---------------- */
const SLOTS={
  seng:{name:'Seng'},nattbord:{name:'Nattbord'},lampe:{name:'Lampe'},teppe:{name:'Teppe'},
  bilde:{name:'Bilde'},deko:{name:'Pynt'},plante:{name:'Plante'},mobel:{name:'Møbel'},bad:{name:'Bad'}
};
const FURN={};
function F(id,slot,name,icon,price,comfort,star=1,sol=0,color=null,tag=null){FURN[id]={id,slot,name,icon,price,comfort,star,sol,color,tag};}
F('seng0','seng','Gammel køyeseng','🛏️',60,3);
F('seng1','seng','Myk dobbeltseng','🛏️',150,7);

const EN_EXACT=new Set(['og','ga','Side','Fra','Les','Kast','Tid','Glad','Ren','Mett','Gul','Rosa','Spa','TV','Lykt','Rom','rom','Server','Bad','Spill','Hent','Bygg','Mot','Rydd','Grav']);
const EN_FRAG_EXTRA={'And ·':'Duck ·','Dyr':'Animals','Fisk':'Fish','Språk / Language':'Language / Språk','🧹 Ryddehjelp: rydd 1 rom':'🧹 Cleaning help: tidy 1 room','Ryddehjelpen ryddet 1 rom':'The cleaner tidied 1 room','Bad – velg':'Bath – choose','Server lunsj':'Serve lunch','Server middag':'Serve dinner','Rom':'Room','rom':'rooms','ga':'gave','og':'and','Fra':'From','Bygg':'Build','Mot':'Next:','Tid':'Time','Dag':'Day'};
let TR_RE=null;
function buildTR(){
  const keys=Object.keys(EN).filter(k=>EN[k]&&k!==EN[k]&&!EN_EXACT.has(k)).concat(Object.keys(EN_FRAG_EXTRA));
  const uniq=[...new Set(keys)].sort((a,b)=>b.length-a.length);
  const esc=k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  TR_RE=new RegExp(uniq.map(k=>{let e=esc(k);if(/^[\p{L}\d]/u.test(k))e='(?<![\\p{L}\\d])'+e;if(/[\p{L}\d]$/u.test(k))e+='(?![\\p{L}\\d])';return e;}).join('|'),'gu');
}
function tr(s){
  if(!S||S.lang!=='en'||!s) return s;
  const t=s.trim(); if(!t) return s;
  if(EN[t]!==undefined&&EN[t]!=='') return s.replace(t,EN[t]);
  if(!TR_RE) buildTR();
  return s.replace(TR_RE,m=>EN_FRAG_EXTRA[m]!==undefined&&EN_EXACT.has(m)?EN_FRAG_EXTRA[m]:(EN[m]??EN_FRAG_EXTRA[m]??m));
}
function trNode(n){
  if(!S||S.lang!=='en') return;
  if(n.nodeType===3){const v=n.nodeValue,t=tr(v);if(t!==v)n.nodeValue=t;return;}
  if(n.nodeType!==1||n.tagName==='SCRIPT'||n.tagName==='STYLE') return;
  const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);
  let cur=n;
  do{
    if(cur.nodeType===3){const v=cur.nodeValue,t=tr(v);if(t!==v)cur.nodeValue=t;}
    else if(cur.tagName==='STYLE'||cur.tagName==='SCRIPT'){}
    else for(const a of ['title','aria-label']){if(cur.hasAttribute&&cur.hasAttribute(a)){const v=cur.getAttribute(a),t=tr(v);if(t!==v)cur.setAttribute(a,t);}}
  }while((cur=w.nextNode()));
}
const trObserver=new MutationObserver(ms=>{
  if(!S||S.lang!=='en') return;
  for(const m of ms){
    if(m.type==='characterData') trNode(m.target);
    else m.addedNodes.forEach(trNode);
  }
});
function detectLang(){try{const l=(navigator.language||'').toLowerCase();return /^(nb|nn|no)\b/.test(l)?'no':'en';}catch(e){return 'no';}}

      return L('Du vanner planten. Blomstene nikker takknemlig.','You water the plant. The flowers nod gratefully.');}

let AC=null;
function sfx(kind){
  if(!S||!S.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const seq={click:[[660,.04]],coin:[[988,.06],[1319,.12]],good:[[523,.08],[659,.08],[784,.16]],bad:[[300,.1],[220,.18]],bell:[[1175,.08],[1568,.25]],
      ding:[[880,.12]],star:[[523,.1],[659,.1],[784,.1],[1047,.3]],poof:[[420,.05],[620,.05]],pop:[[740,.05]],music:[[392,.15],[494,.15],[587,.15],[784,.3],[587,.15],[659,.3]]}[kind]||[[660,.05]];
    let t=AC.currentTime;
    for(const [f,d] of seq){const o=AC.createOscillator(),g=AC.createGain();o.type=kind==='bad'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.85;}
  }catch(e){}
}

function trySpawnGuest(){
  const h=S.min/60; if(h<7||h>=22) return false; if(S.queue.length>=3) return false;
  if(typeof regTrySpawn==='function'&&regTrySpawn()) return true;
  const pool=GTYPES.filter(t=>(!t.ev||evActive(t.ev))&&!t.reg&&!t.celeb&&t.star<=S.stars&&(t.night?h>=18:h<20)&&!(t.id==='vip'&&S.stars<5));
  if(!pool.length) return false;
  const weighted=[];pool.forEach(t=>{const w=t.rare?(t.night?3:1):6;for(let i=0;i<w;i++)weighted.push(t);});
  const g=makeGuest(pick(weighted)); S.queue.push(g);
  toast(`${g.name} har kommet til resepsjonen!`); sfx('bell'); return true;
}

let paused=false, lastPhase=null, saveCount=0;
function tick(){
  if(paused||!S.intro) return;
  S.min+=2;
  let structural=false;
  if(S.min>=24*60){newDay();structural=true;}
  const abs=absMin();
  for(const r of S.rooms){const g=r.guest;if(g&&g.status==='room'){g.stay-=2;if(g.stay<=0){g.status='ready';structural=true;sfx('ding');}}}
  const before=S.queue.length;
  S.queue=S.queue.filter(g=>{if(abs-g.arrive>330){toast(`${g.name} ble lei av å vente og dro videre.`);return false;}return true;});
  if(S.queue.length!==before)structural=true;
  if(abs>=S.nextGuest){if(trySpawnGuest())structural=true;S.nextGuest=abs+rnd(55,110)-S.stars*7+(S.weather&&S.weather.type==='storm'?45:0);}
  if(!S.lobby.ring&&S.min>=8*60&&S.min<19*60&&S.queue.length<3&&Math.random()<0.004){S.lobby.ring=true;S.lobby.ringAt=abs;toast('Telefonen ringer i resepsjonen!');sfx('bell');structural=true;}
  if(S.lobby.ring&&abs-S.lobby.ringAt>90){S.lobby.ring=false;structural=true;}
  if(tickCleaner())structural=true;
  if(tickRecep())structural=true;
  if(tutActive()){tutCheck();if(saveCount%2===0)tutRender();}
  if(ensureWeather())structural=true;
  if(surpriseTick())structural=true;
  if(saveCount%10===5)trophyTick();
  cloudTick();
  if(tickResto())structural=true;
  socialTick();
  if(S.fac.kino&&S.cinema.shownDay!==S.day&&isEvening()){cinemaShow();structural=true;}
  if(tickBuilds())structural=true;
  if(tickWing().length)structural=true;
  if(villTick())structural=true;
  if(snoTick())structural=true;
  if(hkTick())structural=true;
  if(vhTick())structural=true;
  if(shTick())structural=true;
  if(evEnsure()&&S.scene==='wing:ballsal')structural=true;
  if(evTick())structural=true;
  trTick();
  if(pensTick())structural=true;
  if(phTick())structural=true;
  if(ensureDaily())structural=true;
  if(S.wingBuilds&&Object.keys(S.wingBuilds).length&&saveCount%60===0&&S.scene==='hotell')structural=true;
  if(S.min%20===0)decayAnimals();
  const p=phase(); if(p!==lastPhase){if(lastPhase)onPhase(p);lastPhase=p;structural=true;}
  if(structural){renderScene(true);refreshSheet();}
  updateLive(); renderHUD(); checkQuests();
  if(++saveCount%10===0)save();
}
function onPhase(p){
  if(p==='kveld')toast('Det blir kveld på Solglimt. Hvem dukker opp nå, mon tro?');
  if(p==='natt')toast('God natt! Diskoteket og nattens hemmeligheter våkner.');
  if(p==='morgen'&&S.fac.kafe){S.portions+=1;}
}
function newDay(){
  const happyAnimals=Object.entries(S.animals).filter(([id,a])=>(a.m+a.r+a.g)/3>=60).length;
  const visitor=happyAnimals*15;
  const rent=S.mk&&S.mk.rented?MK_RENT:0;

  S.day++; S.min=6*60; S.dayLog={earned:0,out:0};

  const lrent=typeof trRent==='function'?trRent():0; if(lrent){withMain(()=>{S.coins+=lrent;});sum.lrent=lrent;}

const FB_LIKES={familie:['basseng','spillrom','kino'],barnefamilie:['basseng','spillrom','kino'],backpacker:['spillrom','diskotek'],sovnig:['spa','hage'],
  bestemor:['hage','kafe'],dyreelsker:['kjaeledyr'],musiker:['diskotek','kino'],influenser:['takterrasse','spa','basseng'],nattugle:['kino','diskotek'],

function fbPick(list,key){
  const recent=S.fbRecent||(S.fbRecent=[]);
  const opts=list.map((l,i)=>({l,k:key+i})).filter(o=>!recent.includes(o.k));
  const o=(opts.length?pick(opts):pick(list.map((l,i)=>({l,k:key+i}))));
  recent.push(o.k); while(recent.length>8) recent.shift();
  return o.l;
}
/** Lager 1–2 kommentarer ut fra hva gjesten opplevde. Hver kommentar: {s:'+'|'-', t:[no,en]} */
function makeReview(g,r){
  const out=[], ratio=comfort(r)/Math.max(1,g.need), met=wishMet(g,r);
  // 1) Ønsket – det som betyr mest for stjernene
  const w=FB.wish[g.wish]; if(w) out.push({s:met?'+':'-',t:fbPick(met?w.y:w.n,'w'+g.wish+(met?'y':'n'))});
  // 2) Rommet / komforten
  let cl=null;
  if(ratio>=1.3) cl={s:'+',t:fbPick(FB.comfortTop,'ct')};
  else if(ratio>=1) cl={s:'+',t:fbPick(FB.comfortOk,'co')};
  else if(ratio>=.5) cl={s:'-',t:fbPick(FB.comfortLow,'cl')};
  else cl={s:'-',t:fbPick(FB.comfortBad,'cb')};
  // 3) Anlegg som passer gjestetypen (bygget → ros, mulig å bygge → forslag)
  let fl=null; const likes=FB_LIKES[g.type]||[];
  const have=likes.filter(id=>S.fac[id]&&FB.facYes[id]);
  const want=likes.filter(id=>!S.fac[id]&&!(S.builds&&S.builds[id])&&facById(id)&&S.stars>=facById(id).star&&FB.facNo[id]);
  const soon=likes.filter(id=>S.builds&&S.builds[id]&&FB.facBuilding[id]);
  if(have.length){const id=pick(have);fl={s:'+',t:fbPick(FB.facYes[id],'fy'+id),fac:id};}
  else if(soon.length){const id=pick(soon);fl={s:'+',t:fbPick(FB.facBuilding[id],'fb'+id),fac:id};}
  else if(want.length&&Math.random()<.6){const id=pick(want);fl={s:'-',t:fbPick(FB.facNo[id],'fn'+id),fac:id};}
  // 4) Mat
  const fd=(g.fed&&g.wish!=='mat')?{s:'+',t:fbPick(FB.fed,'fd')}:null;
  // Velg én ekstra kommentar: anlegg > komfort som skiller seg ut > mat
  const extra=fl&&Math.random()<.7?fl:(ratio>=1.3||ratio<.5)?cl:(fd||cl);
  if(extra&&extra.t!==out[0]?.t) out.push(extra);
  return out;
}
const fbText=l=>S.lang==='en'?l.t[1]:l.t[0];
/** Hva gjesten tenker nå (vises når du trykker på gjesten). Fast for samme situasjon – ikke tilfeldig hver gang. */
function guestThought(g,r){
  const met=wishMet(g,r), ratio=comfort(r)/Math.max(1,g.need);
  if(!met) return {s:'-',t:['Det er fint her, men jeg savner fortsatt noe …','It’s nice here, but I’m still missing something …']};
  if(ratio<.5) return {s:'-',t:['Rommet er ganske tomt, og senga er hard.','The room is rather bare, and the bed is hard.']};
  if(ratio<1) return {s:'-',t:['Rommet er greit, men det kunne vært koseligere.','The room is fine, but it could be cosier.']};
  if(ratio>=1.3) return {s:'+',t:['For et deilig rom! Akkurat det jeg ønsket meg.','What a lovely room! Exactly what I wanted.']};
  return {s:'+',t:['Jeg trives! Takk for at dere fikset det jeg ønsket.','I’m enjoying it! Thanks for sorting out my wish.']};

/* ---------------- BYGGING OG HOTELLHAGEN ----------------
   Kjøp trekker penger én gang og starter en byggeplass. Anlegget teller først når det er ferdig.
   Byggetiden går i spilltid (stopper når spillet er lukket eller på pause), og lagres i S.builds. */
const BUILD_MIN=120; // 2 spilltimer ≈ 30 sekunder
function buildInfo(id){
  if(S.fac[id]) return {state:'done'};
  const b=S.builds&&S.builds[id];
  if(b){const pct=clamp((absMin()-b.start)/(b.end-b.start)*100,0,100);return {state:'building',pct,left:Math.max(0,b.end-absMin())};}
  const f=facById(id); if(S.stars<f.star) return {state:'locked'};
  return {state:'plot'};
}
function startBuild(id){
  const f=facById(id);
  if(!f||S.fac[id]||(S.builds&&S.builds[id])||S.stars<f.star) return false;
  if(!spend(f.cost)) return false;
  S.builds[id]={start:absMin(),end:absMin()+BUILD_MIN};
  sfx('click'); toast(L(`Byggingen av ${f.name.toLowerCase()} er i gang!`,`Construction of the ${tr(f.name).toLowerCase()} has started!`));
  save(); return true;
}
function tickBuilds(){
  let changed=false;
  for(const id of Object.keys(S.builds||{})){
    const b=S.builds[id];
    if(absMin()>=b.end){
      delete S.builds[id]; S.fac[id]=true; changed=true;
      const f=facById(id); sfx('star'); confetti(); addXP(25);
      toast(L(`${f.name} er ferdig bygget! Gjestene kan ta det i bruk.`,`The ${tr(f.name).toLowerCase()} is finished! Guests can use it now.`),'gold');
      checkQuests();
    }
  }
  if(changed) save();
  return changed;
}

function scaffold(x,y,w,h,pct){

  let s=`<rect x="${x}" y="${y+h-built}" width="${w}" height="${built}" fill="#e9d8bd" stroke="${GI}" stroke-width="3"/>`;
  for(let yy=y+h-24;yy>y+h-built;yy-=24) s+=`<path d="M${x} ${yy} H${x+w}" stroke="#cdb995" stroke-width="2"/>`;
  for(let xx=x;xx<=x+w;xx+=Math.max(30,w/6)) s+=`<path d="M${xx} ${y-6} V${y+h}" stroke="#9aa6b2" stroke-width="4"/>`;
  for(let yy=y+10;yy<y+h;yy+=34) s+=`<path d="M${x-6} ${yy} H${x+w+6}" stroke="#9aa6b2" stroke-width="4"/><rect x="${x-6}" y="${yy-3}" width="${w+12}" height="6" fill="#c98d57" stroke="${GI}" stroke-width="1.5"/>`;
  s+=`<path d="M${x} ${y+h} L${x+w*.5} ${y+20} M${x+w} ${y+h} L${x+w*.5} ${y+20}" stroke="#9aa6b2" stroke-width="2.5" opacity=".7"/>`;
  return s;
}

const b64enc=bytes=>{let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s);};
const b64dec=str=>{const s=atob(str);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;};
async function makeSaveCode(){
  const raw=new TextEncoder().encode(JSON.stringify(S));
  try{
    if(typeof CompressionStream!=='undefined'){
      const buf=await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
      return 'SGH1.'+b64enc(new Uint8Array(buf));
    }
  }catch(e){}
  return 'SGH0.'+b64enc(raw);
}
async function readSaveCode(code){
  code=(code||'').replace(/\s+/g,'');
  const m=code.match(/^SGH([01])\.([A-Za-z0-9+/=]+)$/);
  if(!m) throw new Error('format');
  let bytes=b64dec(m[2]);
  if(m[1]==='1'){
    if(typeof DecompressionStream==='undefined') throw new Error('browser');
    bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  }
  const d=JSON.parse(new TextDecoder().decode(bytes));
  if(!d||typeof d!=='object'||!Array.isArray(d.rooms)||typeof d.coins!=='number'||typeof d.stars!=='number') throw new Error('content');
  return d;
}

function tone(freq,dur=.15,type='triangle',vol=.12){
  if(!S||!S.sound) return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);}catch(e){}
}

     <span class="td-f" style="left:8%;top:10%;width:16%">${furnArt('bil2')}</span><span class="td-f" style="right:30%;bottom:7%;width:9%">${furnArt('pla2')}</span>

      $('#tdM').textContent=pick([L('Ryddet!','Tidied!'),L('Vekk med det!','Gone!'),L('Skinnende!','Spotless!')]);

/* ===== 4. DISKOTEK ===== */
function startDisco(){
  const lvl=gameLevel('disko'); const bpm=92+lvl*10, beat=60/bpm, travel=Math.max(1.05,1.7-lvl*.12);
  const lanes=[{c:'#cf4a3e',k:['ArrowLeft','KeyD'],f:392,a:'◀'},{c:'#f2a234',k:['ArrowUp','KeyF'],f:440,a:'▲'},{c:'#5fb9c6',k:['ArrowDown','KeyJ'],f:523,a:'▼'},{c:'#5c9a47',k:['ArrowRight','KeyK'],f:587,a:'▶'}];
  // Lag en melodi: 32 slag, flere noter på høyere nivå
  const notes=[];let last=-1;
  for(let b=4;b<36;b++){
    let lane=rnd(0,3);if(lane===last&&Math.random()<.6)lane=(lane+rnd(1,3))%4;last=lane;
    notes.push({t:b*beat,lane,hit:false,el:null});
    if(lvl>=2&&b%4===2&&Math.random()<.5) notes.push({t:(b+.5)*beat,lane:(lane+2)%4,hit:false,el:null});
  }
  const end=37*beat+travel; let start=0,raf=0,pts=0,combo=0,best=0,perf=0,good=0,miss=0,nextBeat=0;
  openGame('disko',`<div class="gstage"><div class="ginfo"><span>${L('Poeng','Score')} <b id="dsP">0</b></span><span>${L('Rekke','Combo')} <b id="dsC">0</b></span></div>
   <div class="ds-floor" id="dsF">${lanes.map((l,i)=>`<div class="ds-lane" style="left:${i*25}%"></div>`).join('')}<div class="ds-hit"></div><div class="ds-ball">🪩</div></div>
   <div class="ds-pads" id="dsPads">${lanes.map((l,i)=>`<button class="ds-pad" data-l="${i}" style="background:${l.c}">${l.a}</button>`).join('')}</div>
   <p class="gmsg" id="dsM">${L('Trykk når fargen treffer streken!','Tap when the colour hits the line!')}</p></div>`);
  const F=$('#dsF');
  notes.forEach(n=>{const d=document.createElement('div');d.className='ds-note';d.style.left=(n.lane*25+3)+'%';d.style.background=lanes[n.lane].c;F.appendChild(d);n.el=d;});
  const H=()=>F.clientHeight, hitY=()=>H()*.86;
  function judge(lane){
    const now=(performance.now()-start)/1000;
    let bestN=null,bd=9;for(const n of notes){if(n.hit||n.lane!==lane)continue;const d=Math.abs(n.t+travel-now);if(d<bd){bd=d;bestN=n;}}
    const pad=document.querySelector(`.ds-pad[data-l="${lane}"]`);pad.classList.remove('pressed');void pad.offsetWidth;pad.classList.add('pressed');
    if(bestN&&bd<.13){bestN.hit=true;bestN.el.classList.add('pop');perf++;combo++;pts+=10+Math.floor(combo/5);tone(lanes[lane].f,.18);$('#dsM').textContent=L('Perfekt!','Perfect!');}
    else if(bestN&&bd<.24){bestN.hit=true;bestN.el.classList.add('pop');good++;combo++;pts+=5;tone(lanes[lane].f,.14);$('#dsM').textContent=L('Bra!','Good!');}
    else{combo=0;tone(150,.08,'square',.05);$('#dsM').textContent=L('Litt i utakt …','A bit off-beat …');}
    best=Math.max(best,combo);$('#dsP').textContent=pts;$('#dsC').textContent=combo;
  }
  $('#dsPads').addEventListener('pointerdown',e=>{const b=e.target.closest('.ds-pad');if(!b)return;e.preventDefault();judge(+b.dataset.l);});
  const key=e=>{const i=lanes.findIndex(l=>l.k.includes(e.code));if(i>=0){e.preventDefault();judge(i);}};
  addEventListener('keydown',key);
  function frame(){
    const now=(performance.now()-start)/1000;
    if(now>=nextBeat*beat&&nextBeat<40){tone(nextBeat%4===0?110:82,.06,'sine',.08);nextBeat++;F.classList.toggle('pulse',nextBeat%2===0);}
    for(const n of notes){if(n.hit){continue;}const y=(now-(n.t))/travel*hitY();
      if(y<-40){n.el.style.display='none';continue;}n.el.style.display='';n.el.style.transform=`translateY(${y}px)`;
      if(now-(n.t+travel)>.24){n.hit=true;miss++;combo=0;n.el.classList.add('missed');$('#dsC').textContent=0;}}
    if(now>end){const max=notes.length*12;const score=Math.min(100,Math.round(pts/max*100));
      finishGame('disko',score,L(` · perfekt ${perf}, bra ${good}, bom ${miss}, lengste rekke ${best}`,` · perfect ${perf}, good ${good}, missed ${miss}, best combo ${best}`));return;}
    raf=requestAnimationFrame(frame);
  }
  start=performance.now()+600; setTimeout(()=>{start=performance.now();raf=requestAnimationFrame(frame);},600);
  gameCleanup=()=>{cancelAnimationFrame(raf);removeEventListener('keydown',key);};
}

function startBoat(){
  if(S.weather&&S.weather.type==='storm'){toast(L('Det er storm! Ola sier det er for farlig å ro over i dag.','There’s a storm! Ola says it’s too dangerous to row across today.'));sfx('bad');return;}
  const lvl=gameLevel('baat'); const total=24, speed=170+lvl*25, every=Math.max(.42,.85-lvl*.08);
  let lane=1, hearts=3, dist=0, bottles=0, objs=[], raf=0, last=0, spawn=.6, over=false;
  openGame('baat',`<div class="gstage"><div class="ginfo"><span>${L('Flasker','Bottles')} <b id="btB">0</b></span><span id="btH">❤️❤️❤️</span></div>
   <div class="bt-prog"><i id="btP"></i><span>🏝️</span></div>
   <div class="bt-sea" id="btS"><div class="bt-lane" style="left:33.3%"></div><div class="bt-lane" style="left:66.6%"></div><div class="bt-boat" id="btBoat">🛶<span class="bt-ola">${npcAv('ola')}</span></div></div>
   <div class="row" style="justify-content:center"><button class="btn big blue" id="btL" aria-label="${L('Venstre','Left')}">◀</button><button class="btn big blue" id="btR" aria-label="${L('Høyre','Right')}">▶</button></div>
   <p class="gmsg" id="btM">${L('Styr unna skjærene og plukk opp flaskene!','Steer clear of the rocks and pick up the bottles!')}</p></div>`);
  const sea=$('#btS'), boat=$('#btBoat');
  const W=()=>sea.clientWidth, H=()=>sea.clientHeight, lx=l=>(l+.5)*W()/3;
  const place=()=>{boat.style.left=lx(lane)+'px';};place();
  const move=d=>{if(over)return;lane=clamp(lane+d,0,2);place();tone(300+lane*80,.06,'sine',.06);};
  $('#btL').onclick=()=>move(-1); $('#btR').onclick=()=>move(1);
  sea.addEventListener('pointerdown',e=>{const r=sea.getBoundingClientRect();move(e.clientX-r.left<r.width/2?-1:1);});
  const key=e=>{if(e.code==='ArrowLeft'){e.preventDefault();move(-1);}if(e.code==='ArrowRight'){e.preventDefault();move(1);}};
  addEventListener('keydown',key);
  function end(){
    if(over)return; over=true;
    const score=bottles*10+hearts*15+(hearts?20:0);
    ui.afterGame=mkArrive;
    finishGame('baat',score,hearts?L(' · Ola ror deg trygt i land','· Ola rows you safely ashore'):L(' · Ola tok over årene','· Ola took over the oars'));
  }
  function frame(t){
    if(!last)last=t; const dt=Math.min(.05,(t-last)/1000); last=t;
    dist+=dt; spawn-=dt;
    if(spawn<=0&&dist<total-1.5){spawn=every*(.7+Math.random()*.6);
      const type=Math.random()<.62?'rock':'bottle'; const l=rnd(0,2);
      const el=document.createElement('div');el.className='bt-obj '+type;el.textContent=type==='rock'?'🪨':'🍾';sea.appendChild(el);
      objs.push({l,y:-40,type,el});}
    const bY=H()-62;
    for(const o of objs){if(o.done)continue;o.y+=speed*dt;o.el.style.transform=`translate(${lx(o.l)-20}px,${o.y}px)`;
      if(o.l===lane&&o.y>bY-34&&o.y<bY+20){o.done=true;
        if(o.type==='rock'){hearts--;sfx('bad');boat.classList.remove('flash-bad');void boat.offsetWidth;boat.classList.add('flash-bad');o.el.classList.add('hit');$('#btM').textContent=L('Au! Et skjær!','Ouch! A rock!');}
        else{bottles++;sfx('coin');o.el.classList.add('got');$('#btM').textContent=pick([L('En flaske!','A bottle!'),L('Fint fanget!','Nice catch!')]);}
        $('#btB').textContent=bottles;$('#btH').textContent='❤️'.repeat(Math.max(0,hearts))+'🤍'.repeat(3-Math.max(0,hearts));}
      if(o.y>H()+40){o.done=true;o.el.remove();}}
    const p=$('#btP');if(p)p.style.width=Math.min(100,dist/total*100)+'%';
    if(hearts<=0||dist>=total){end();return;}
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
  gameCleanup=()=>{cancelAnimationFrame(raf);removeEventListener('keydown',key);};
}
function mkArrive(){

}

function mkFix(z){

function mkLook(id){
  const T={
    stone:()=>L('Noen har risset «A+S 1971» i steinen, med et lite hjerte rundt. Det er nesten borte etter alle årene.','Someone has carved “A+S 1971” into the stone, with a little heart around it. It has almost worn away over the years.'),
    lighthouse:()=>isEvening()?(S.mk.done?L('Fyret blinker tre ganger, så en pause. Over sundet blinker et lite lys tilbake fra hotellet.','The lighthouse blinks three times, then pauses. Across the strait, a little light blinks back from the hotel.'):L('Lyset i fyret er tent. Noen står i døra.','The lighthouse lamp is on. Someone is standing in the doorway.')):L('Døra er låst. På en lapp står det: «Sover. Kom igjen i kveld. – S.»','The door is locked. A note says: “Sleeping. Come back this evening. – S.”'),
  };

function mkAct(id){
  if(id==='house'){go('mkhus');return;}
  if(id==='boat'){say('ola',[L('Klar for å dra hjem? Hopp i båten!','Ready to head home? Hop in the boat!')],()=>{go('area:brygge');});return;}
  if(id==='bottle'){mkGivePage('p1');renderScene(true);say('tiril',[L('En flaskepost! Inni ligger en revet bit av en dagbokside. Håndskriften … den er Ansgars!','A message in a bottle! Inside is a torn piece of a diary page. The handwriting … it’s Ansgar’s!')],()=>{openSheet('mkpages');mkCheckEnding();});checkQuests();save();return;}
  if(id==='signe'){mkSigne();return;}
