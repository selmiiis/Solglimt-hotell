function mkSigne(){
  const n=S.mk.pages.length; let lines;
  if(S.mk.done) lines=[pick([L('Lyset over sundet blinket i går også. Takk for at du holder det tent.','The light across the strait blinked again last night. Thank you for keeping it on.'),L('Kom innom når du vil. Fyret er alltid åpent for deg om kvelden.','Come by whenever you like. The lighthouse is always open to you in the evening.'),L('Ansgar hadde likt deg, tror jeg.','Ansgar would have liked you, I think.')])];
  else if(S.mk.signe===0){S.mk.signe=1;const intro=true;lines=[L('Å, en gjest! Det er lenge siden. Jeg heter Signe, og jeg har passet dette fyret i over femti år.','Oh, a visitor! It’s been a long time. I’m Signe, and I’ve kept this lighthouse for over fifty years.'),L('Du kommer fra Solglimt? Da vet du kanskje at det gamle huset der borte var Ansgars, før han dro over sundet.','You’re from Solglimt? Then perhaps you know that old house over there was Ansgar’s, before he crossed the strait.'),L('Han skrev alltid i dagboka si. Hvis du finner noe av det han skrev … vil du vise meg det?','He was always writing in his diary. If you find anything he wrote … would you show me?')];
    if(n>=3&&!S.mk.pages.includes('p4')){lines.push(L('Vent … du har allerede funnet tre biter? Da må du få denne også.','Wait … you’ve already found three pieces? Then you must have this too.'),L('Den blåste inn gjennom vinduet mitt den dagen han dro. Jeg har aldri klart å lese den ferdig.','It blew in through my window the day he left. I’ve never been able to finish reading it.'));mkGivePage('p4');}}
  else if(n<3) lines=[n?L(`Du har funnet ${n} bit${n>1?'er':''}? Den håndskriften kjenner jeg igjen. Let videre i huset, er du snill.`,`You’ve found ${n} piece${n>1?'s':''}? I recognise that handwriting. Please keep looking in the house.`):L('Har du funnet noe av det Ansgar skrev? Sjekk stranda og det gamle huset.','Have you found anything Ansgar wrote? Check the beach and the old house.')];
  else if(!S.mk.pages.includes('p4')){lines=[L('Tre biter … Da tror jeg det er på tide at du får denne.','Three pieces … Then I think it’s time you had this.'),L('Den blåste inn gjennom vinduet mitt den dagen han dro. Jeg har aldri klart å lese den ferdig.','It blew in through my window the day he left. I’ve never been able to finish reading it.')];mkGivePage('p4');}
  say('signe',lines,()=>{renderScene(true);mkCheckEnding();checkQuests();save();});
}
function mkCheckEnding(){

  say('signe',[
    L('Så det var derfor hotellet heter Solglimt …','So that’s why the hotel is called Solglimt …'),

    L('Ta denne lykta. Den sto i vinduet mitt da vi var unge. Nå hører den hjemme på hotellet, hos deg.','Take this lantern. It stood in my window when we were young. Now it belongs at the hotel, with you.'),

  const s=SIDE.find(q=>q.npc===id), offer=s&&!S.side[s.id]&&S.stars>=s.star;
  return `<g class="hot" data-act="talk" data-arg="${id}"><rect x="${x-40*sc}" y="${y-150*sc}" width="${80*sc}" height="${150*sc}" fill="transparent"/>${arFigure(n.look,x,y,sc)}
   <rect x="${x-34}" y="${y+4}" width="68" height="20" rx="10" fill="#fff8ec" stroke="${AI}" stroke-width="2"/><text x="${x}" y="${y+18}" text-anchor="middle" font-size="12" font-weight="800" fill="${AI}" font-family="Grandstander, sans-serif">${esc(first)}</text>
   ${offer?`<circle cx="${x+28*sc}" cy="${y-140*sc}" r="11" fill="#f7c948" stroke="${AI}" stroke-width="2"/><text x="${x+28*sc}" y="${y-135*sc}" text-anchor="middle" font-size="14" font-weight="900" fill="${AI}">!</text>`:''}</g>`;
}

function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function ensureDaily(){
  const k=todayKey(); const D=S.daily2;
  if(D&&D.date===k) return false;
  const pool=DAILY_POOL.filter(t=>!t.ok||t.ok());
  let h=hashStr(k+'solglimt'); const pickd=[];
  while(pickd.length<3&&pool.length){const i=h%pool.length;pickd.push(pool.splice(i,1)[0]);h=Math.imul(h,48271)>>>0;h=(h>>>3)+7;}
  const base={}; DAILY_POOL.forEach(t=>base[t.stat]=S.stats[t.stat]||0);
  S.daily2={date:k,tasks:pickd.map(t=>({id:t.id,n:t.n()})),base,claimed:[],done:false};
  return true;
}
function dailyProg(t){const def=DAILY_POOL.find(x=>x.id===t.id);return Math.max(0,(S.stats[def.stat]||0)-(S.daily2.base[def.stat]||0));}
const dailyReward=()=>40+S.stars*20;
function dailyReadyCount(){if(!S.daily2)return 0;return S.daily2.tasks.filter(t=>!S.daily2.claimed.includes(t.id)&&dailyProg(t)>=t.n).length;}
function claimDaily(id){
  const D=S.daily2; const t=D&&D.tasks.find(x=>x.id===id); if(!t||D.claimed.includes(id)||dailyProg(t)<t.n) return;
  D.claimed.push(id); addCoins(dailyReward()); addXP(15);
  if(D.claimed.length===D.tasks.length&&!D.done){
    D.done=true; S.dailyDays=(S.dailyDays||0)+1; S.dailyLog=(S.dailyLog||[]).concat(D.date).slice(-30);
    setTimeout(()=>{addSol(1);confetti();toast(L(`Dagsmerke! Du har nå ${S.dailyDays} dagsmerker.`,`Day badge! You now have ${S.dailyDays} day badges.`),'gold');},300);
  }
  lastReadyKey=''; refreshSheet(); checkQuests(); save();
}

     return `<div class="daily-row ${got?'got':''}"><span class="dr-ic">${def.e}</span><div class="dr-tx"><b>${esc(S.lang==='en'?def.en(t.n):def.no(t.n))}</b><div class="bar"><i style="width:${p/t.n*100}%"></i></div></div>${got?`<span class="tag ok">✓</span>`:p>=t.n?`<button class="btn small green" data-act="claimDaily" data-arg="${t.id}">+${dailyReward()}</button>`:`<span class="tag">${p}/${t.n}</span>`}</div>`;}).join('')}</div>
   <div class="week">${last7.map(d=>`<span class="wd ${d.on?'on':''} ${d.today?'today':''}" title="${d.k}">${d.on?'☀':d.lbl}</span>`).join('')}</div></div>`;

/* ---- Borte-inntekt: hotellet går litt mens spillet er lukket ---- */
function awayIncome(){
  const now=Date.now(), last=S.lastSeen||now; S.lastSeen=now;
  const mins=(now-last)/60000; if(mins<10) return null;
  const hours=Math.min(8,mins/60);
  const occupied=S.rooms.filter(r=>r.slots.seng).length;
  const coins=Math.round(hours*(occupied*6+facBonus()*1.5+S.stars*10)*(recepOn()?1.25:1));
  if(coins<=0) return null;
  S.coins+=coins;
  return {mins:Math.round(mins),coins,capped:mins>480};
}

  const w=wingById(id);
  if(S.wing[id]) return {state:'done'};
  const b=S.wingBuilds[id];
  if(b){const left=Math.max(0,b.end-Date.now());return {state:'building',pct:clamp((Date.now()-b.start)/(b.end-b.start)*100,0,100),left};}
  if(S.stars<w.star) return {state:'locked'};
  if(w.need&&!S.wing[w.need]) return {state:'needs'};

/* ---------------- RESEPSJONIST: ansatt som sjekker ut gjester og tar betalt ---------------- */
const RECEP_STAR=4, RECEP_DELAY=10; // spillminutter fra gjesten er klar til hun sjekker ut
const RECEP_LOOK={skin:'#c98e66',hair:'#7a3b1e',style:'bun',shirt:'#cf4a3e',acc:'pin',bg:'#f8e0d6'};
const recepWage=()=>40+S.stars*15;
const recepOn=()=>!!(S.recep&&!S.recep.off);
function hireRecep(){
  if(S.stars<RECEP_STAR) return;
  const w=recepWage(); if(S.coins<w){toast(L('Du har ikke nok mynter til første dagslønn.','You don’t have enough coins for the first day’s wage.'));return;}
  S.coins-=w;
  const old=S.recep||{count:0,earned:0};
  S.recep={off:false,since:S.day,count:old.count||0,inn:old.inn||0,earned:old.earned||0,today:0,doIn:old.doIn,doOut:old.doOut,doWish:old.doWish,tips:old.tips||0};
  sfx('good'); toast(L('Vigdis er ansatt! Hun gir gjestene rom, sjekker dem ut og tar imot betalingen for deg.','Vigdis is hired! She gives guests rooms, checks them out and takes the payment for you.'),'good');
  renderHUD(); refreshSheet(); renderScene(true); checkQuests(); save();
}
function fireRecep(){
  if(!S.recep) return; S.recep.off=true;
  toast(L('Vigdis tar fri. Du kan ansette henne igjen når du vil.','Vigdis takes time off. You can hire her again whenever you like.'));
  refreshSheet(); renderScene(true); save();
}
// Kalles fra tick(): Vigdis gir ventende gjester et passende rom og sjekker ut gjester som er klare.
function recepBestRoom(g){
  let best=null,bs=-1;
  for(const r of S.rooms){
    if(r.guest||r.dirty||!r.slots.seng) continue;
    const sc=rateGuest(g,r)*1000+(wishMet(g,r)?500:0)-comfort(r); // best mulig vurdering, men spar de flotteste rommene når et enklere holder
    if(sc>bs){bs=sc;best=r;}
  }
  return best;
}
function recepCheckin(g,r){
  const gi=S.queue.indexOf(g); if(gi<0) return;
  S.queue.splice(gi,1); g.status='room'; g.room=r.id; g.stayMax=g.stay=rnd(140,240); r.guest=g;
  S.stats.checkins++; if(!S.col.gjester.includes(g.type)) S.col.gjester.push(g.type);
  S.recep.inn=(S.recep.inn||0)+1; sfx('bell');
  const met=wishMet(g,r);
  toast(met?L(`Vigdis ga ${g.name} rom ${r.id} – akkurat som ønsket!`,`Vigdis gave ${g.name} room ${r.id} – just what they wished for!`):L(`Vigdis sjekket inn ${g.name} på rom ${r.id}.`,`Vigdis checked ${g.name} into room ${r.id}.`),met?'good':'');
}
// Vigdis tipser gjestene om aktiviteter, dyr og mat når de ønsker seg det.
function recepWish(){
  const abs=absMin();
  for(const r of S.rooms){
    const g=r.guest; if(!g||g.status!=='room'||g.wishDone||!['moro','dyr','mat'].includes(g.wish)) continue;
    if(g.recepAt==null){g.recepAt=abs;continue;}
    if(abs-g.recepAt<RECEP_DELAY) continue;
    if(g.wish==='mat'){
      if(S.portions<1) continue;
      S.portions--; g.wishDone=true; g.fed=true; S.stats.served++; addCoins(6+S.restLvl*3,true);
      toast(L(`Vigdis sendte ${g.name} til restauranten. «Nam!»`,`Vigdis sent ${g.name} to the restaurant. “Yum!”`),'good');
      return true;
    }
    const opts=g.wish==='moro'?funOptions():petOptions(); if(!opts.length) continue;
    const likes=(typeof FB_LIKES!=='undefined'&&FB_LIKES[g.type])||[];
    const fav=opts.find(o=>likes.includes(o.id)); const o=fav||pick(opts);
    g.wishDone=true; if(fav) g.party=true;
    S.recep.tips=(S.recep.tips||0)+1;
    toast(fav?L(`Vigdis sendte ${g.name} til ${tr(o.label).toLowerCase()} – favoritten! (+1 stjerne)`,`Vigdis sent ${g.name} to the ${tr(o.label).toLowerCase()} – their favourite! (+1 star)`):L(`Vigdis tipset ${g.name} om ${tr(o.label).toLowerCase()}.`,`Vigdis told ${g.name} about the ${tr(o.label).toLowerCase()}.`),'good');
    return true;
  }
  return false;
}
function tickRecep(){
  if(!recepOn()) return false;
  const abs=absMin(), R=S.recep; let did=false;
  if(R.doIn!==false){
    for(const g of S.queue.slice()){
      if(abs-g.arrive<RECEP_DELAY) continue;
      const r=recepBestRoom(g); if(!r) break;
      recepCheckin(g,r); did=true; break;
    }
  }
  if(R.doWish!==false&&!did&&recepWish()) did=true;
  if(R.doOut!==false&&!did){
    for(const r of S.rooms){
      const g=r.guest; if(!g||g.status!=='ready') continue;
      if(g.readyAt==null){g.readyAt=abs;continue;}
      if(abs-g.readyAt>=RECEP_DELAY){
        const before=S.coins; ui.recepNow=true; checkout(r); ui.recepNow=false;
        const got=S.coins-before; R.count++; R.earned+=got; R.today=(R.today||0)+got; did=true; break;
      }
    }
  }
  if(did){checkQuests();save();}
  return did;
}
// Kalles fra newDay(): trekker lønn. Har du ikke råd, går hun hjem til du ansetter igjen.
function payRecepWage(){
  if(!recepOn()) return 0;
  const w=recepWage(); S.recep.today=0;
  if(S.coins>=w){S.coins-=w;return w;}
  S.recep.off=true;
  setTimeout(()=>toast(L('Du hadde ikke råd til lønna til Vigdis, så hun har tatt fri. Ansett henne igjen når du har råd.','You couldn’t afford Vigdis’s wage, so she has taken time off. Hire her again when you can afford it.')),900);
  return -1;
}

    <div class="row"><button class="btn small green" data-act="hireRecep" ${S.coins<w?'disabled':''}>${L('Ansett Vigdis','Hire Vigdis')} · <span class="coin" style="width:14px;height:14px"></span>${w} ${L('per dag','per day')}</button></div>`;
  return `<div class="card recep-card"><div class="row" style="align-items:center"><span style="width:58px;flex:none">${avatar(RECEP_LOOK)}</span><div style="flex:1"><b>${L('Resepsjonist','Receptionist')}</b>${body}</div></div></div>`;
}

function poolItemsToday(){
  const p=PL(); if(p.fishDay===S.day) return [];
  const h=hashStr('pool'+S.day); const n=4+(h%3); const out=[];
  for(let i=0;i<n;i++){const hh=hashStr('pi'+S.day+'-'+i);out.push({i,x:160+(hh%460),y:350+((hh>>>9)%110),it:POOL_ITEMS[hh%POOL_ITEMS.length]});}

  const spec=(S.cellar&&S.cellar.clues===1)?{id:'ror'}:POOL_SPECIAL.find(s=>!p.found.includes(s.id));
  if(spec&&p.specialDay!==S.day) out.push({i:'s',x:200+(h%380),y:380+((h>>>5)%70),special:spec.id});
  return out.filter(o=>!p.picked.includes(String(o.i)));

    say('kai',[L('Hæ? Et vanntett metallrør på bunnen av bassenget?','Huh? A watertight metal tube at the bottom of the pool?'),L('Det er en lapp inni: «Den andre biten ser du bare når lyset slukkes og filmen starter. – A.»','There’s a note inside: “You can only see the second piece when the lights go out and the film starts. – A.”'),L('A … Ansgar? Kino! Gå på kino i kveld!','A … Ansgar? Cinema! Go to the cinema tonight!')]);

    toast(L(`Du fisket opp ${s.no}!`,`You fished out ${s.en}!`),'gold');

function tonightFilm(){const c=S.cinema;return c&&c.pick&&c.pick.day===S.day?c.pick.idx:(S.day-1)%CINEMA_FILMS.length;}
function cinemaShow(){
  const c=S.cinema; if(!S.fac.kino||c.shownDay===S.day||!isEvening()) return 0;

  if(!c.seen.includes(idx)){c.seen.push(idx);setTimeout(()=>toast(L('Ny filmplakat på plakatveggen!','New film poster on the poster wall!'),'gold'),400);}

  return n;
}

function startBowling(){
  const lvl=gameLevel('bowling'); const speed=1.2+lvl*.35; let frame=0,roll=0,standing=10,score=0,phase='aim',t0=performance.now(),raf=0,firstRoll=0;
  const frames=5;
  openGame('bowling',`<div class="gstage"><div class="ginfo"><span>${L('Runde','Frame')} <b id="bwF">1</b>/${frames}</span><span>${L('Kast','Roll')} <b id="bwR">1</b></span><span>${L('Poeng','Score')} <b id="bwP">0</b></span></div>
   <div class="bw-lane" id="bwL"><div class="bw-pins" id="bwPins">${Array.from({length:10},(_,i)=>{const row=i<4?0:i<7?1:i<9?2:3;const idx=i<4?i:i<7?i-4:i<9?i-7:0;const n=4-row;const x=50+(idx-(n-1)/2)*12;return `<span class="bw-pin" data-p="${i}" style="left:${x}%;top:${6+row*9}%"></span>`;}).join('')}</div>
    <div class="bw-aim" id="bwA"></div><div class="bw-ball" id="bwB"></div></div>
   <p class="gmsg" id="bwM">${L('Trykk «Kast!» når pilen peker midt på kjeglene.','Press “Roll!” when the arrow points at the middle of the pins.')}</p>
   <button class="btn big" id="bwBtn">${L('Kast!','Roll!')}</button></div>`);
  const A=$('#bwA'),B=$('#bwB');
  let pos=50;
  function loop(now){ if(phase==='aim'){pos=50+Math.sin((now-t0)/1000*speed*Math.PI)*42;A.style.left=pos+'%';B.style.left=pos+'%';} raf=requestAnimationFrame(loop); }
  raf=requestAnimationFrame(loop);
  gameCleanup=()=>cancelAnimationFrame(raf);
  function knock(){
    const off=Math.abs(pos-50); let n;
    if(off<4) n=standing; else if(off<10) n=Math.max(0,standing-rnd(1,2)); else if(off<18) n=Math.round(standing*rnd(4,7)/10); else if(off<28) n=Math.round(standing*rnd(1,4)/10); else n=0;
    return Math.min(standing,n);
  }
  $('#bwBtn').onclick=()=>{
    if(phase!=='aim') return; phase='roll'; tone(140,.25,'sine',.1);
    B.style.transition='bottom .7s ease-in'; B.style.bottom='78%';
    setTimeout(()=>{
      const n=knock(); const up=[...document.querySelectorAll('.bw-pin:not(.down)')];
      up.sort(()=>Math.random()-.5).slice(0,n).forEach(p=>p.classList.add('down'));
      standing-=n; let pts=n; let msg;
      if(roll===0&&standing===0){pts+=5;msg=L('STRIKE! +5 bonus','STRIKE! +5 bonus');sfx('star');}
      else if(roll===1&&standing===0){pts+=2;msg=L('Spare! +2 bonus','Spare! +2 bonus');sfx('good');}
      else msg=n?L(`${n} kjegle${n===1?'':'r'}!`,`${n} pin${n===1?'':'s'}!`):L('Renna …','Gutter …');
      if(n) tone(300+n*30,.12,'square',.05);
      score+=pts; $('#bwP').textContent=score; $('#bwM').textContent=msg;
      setTimeout(()=>{
        B.style.transition='none'; B.style.bottom='4%';
        if(roll===0&&standing>0){roll=1;}

function julDate(){ // dagens luke: 1–24 i desember, 24 i romjula og i januar, 0 ellers
  if(S.julFakeDay) return S.julFakeDay;
  const d=new Date(), m=d.getMonth();
  if(m===11) return Math.min(24,d.getDate());
  if(m===0&&d.getDate()<=6) return 24;
  return 0;
}
const julActive=()=>!!S.julForce||julDate()>0;
const isWinter=()=>{const m=new Date().getMonth();return !!S.julForce||m===11||m<=1;};

const J=()=>S.jul;

/* ---- julekalenderen ---- */
const ADVENT=Array.from({length:24},(_,i)=>{
  const n=i+1;
  if(n===24) return {k:'big'};
  if(n%6===0) return {k:'deco'};
  if(n%5===0) return {k:'sol'};
  if(n%4===0) return {k:'food'};
  if(n%3===0) return {k:'xp'};
  return {k:'coins'};
});
const ADVENT_SURPRISE=[
  ['Et marsipangris!','A marzipan pig!'],['En lapp fra Pernille: «God jul, sjef!»','A note from Pernille: “Merry Christmas, boss!”'],['Et glitrende julekort fra Ola.','A glittering Christmas card from Ola.'],
  ['En pakke ullsokker. Oskar har strikket dem selv.','A pack of woolly socks. Oskar knitted them himself.'],['En pepperkake formet som en måke.','A gingerbread biscuit shaped like a seagull.'],['En liten snøkule med Solglimt inni.','A little snow globe with Solglimt inside.']
];
function adventReward(n){
  const a=ADVENT[n-1], base=60+S.stars*20;
  if(a.k==='coins') return {coins:base};
  if(a.k==='xp') return {coins:Math.round(base/2),xp:40};
  if(a.k==='food') return {portions:3};
  if(a.k==='sol') return {sol:1};
  if(a.k==='deco') return {deco:true};
  return {sol:3,coins:base*3,rare:'julestjerne'};
}
function openAdvent(n){
  n=+n; const j=J(); if(j.doors.includes(n)||n>julDate()) return;
  j.doors.push(n); const r=adventReward(n); const msg=[];
  if(r.coins){addCoins(r.coins,true);msg.push(`+${r.coins} ${L('mynter','coins')}`);}
  if(r.xp){addXP(r.xp);msg.push(`+${r.xp} XP`);}
  if(r.portions){S.portions+=r.portions;msg.push(L(`+${r.portions} porsjoner julegrøt`,`+${r.portions} portions of Christmas porridge`));}
  if(r.sol){setTimeout(()=>addSol(r.sol),200);}
  if(r.deco){const d=JUL_DECO.find(d=>!j.deco[d.id]);if(d){j.deco[d.id]=true;msg.push(L(`Gratis julepynt: ${d.no}!`,`Free decoration: ${d.en}!`));}else{addCoins(150,true);msg.push(`+150 ${L('mynter','coins')}`);}}
  if(r.rare){giveRare(r.rare);}
  const sur=ADVENT_SURPRISE[(n*7)%ADVENT_SURPRISE.length];
  sfx('star'); if(n===24) confetti();
  ui.lastDoor={n,text:L(sur[0],sur[1]),msg:msg.join(' · ')+(r.sol?` · +${r.sol} ${L('solstjerne','sun star')}${r.sol>1?L('r','s'):''}`:'')};
  S.stats.advent=(S.stats.advent||0)+1;
  refreshSheet(); renderScene(true); checkQuests(); save();
}

  }

    const c=e.target.closest('.gk-cell'); if(!c||phase!=='play') return; const i=+c.dataset.i; if(picked.includes(i)) return;

  });
  gameCleanup=()=>clearTimeout(tmr);

}

async function packCode(prefix,obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));
  try{if(typeof CompressionStream!=='undefined'){const buf=await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();return prefix+'1.'+b64enc(new Uint8Array(buf)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}}catch(e){}
  return prefix+'0.'+b64enc(raw).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function unpackCode(prefix,code){
  code=(code||'').replace(/\s+/g,'');
  const m=code.match(new RegExp('^'+prefix+'([01])\\.([A-Za-z0-9_\\-]+)$')); if(!m) throw new Error('format');
  let s=m[2].replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='=';
  let bytes=b64dec(s);
  if(m[1]==='1') bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(bytes));
}

function rsSpawn(){
  const mp=mealPeriod(); if(!mp) return false;
  const d=RSD(); const n=rsTables(); const used=new Set(d.d.map(x=>x.t));
  const free=[...Array(n).keys()].filter(i=>!used.has(i)); if(!free.length) return false;
  const t=pick(free); const menu=rsMenu(mp[0]);
  const here=S.rooms.filter(r=>r.guest&&r.guest.status==='room'&&r.guest.mealKey!==S.day+mp[0]&&!d.d.some(x=>x.rid===r.id));
  let diner;
  if(here.length&&Math.random()<.7){const r=pick(here);const g=r.guest;g.mealKey=S.day+mp[0];diner={kind:'guest',rid:r.id,name:g.name,look:g.look};}
  else diner={kind:'visitor',name:pick(RS_NAMES),look:{skin:pick(SKINS),hair:pick(HAIRS),style:pick(['short','long','curly','bun']),shirt:pick(['#5fb9c6','#f2a234','#cf4a3e','#5c9a47','#6d4f93','#ee86b6']),acc:pick(['','','glasses','cap','bow'])}};
  d.d.push(Object.assign(diner,{id:++d.seq,t,dish:pick(menu),state:'wait',at:absMin(),buffet:mp[0]==='frokost'}));
  return true;
}
function rsServe(id,self){
  const d=RSD(); const x=d.d.find(y=>y.id===+id); if(!x||x.state!=='wait') return;
  if(S.portions<1){if(!self){toast(L('Bufeten er tom! Lag mer mat først.','The buffet is empty! Cook more food first.'));sfx('bad');}return;}
  S.portions--; x.state='eat'; x.until=absMin()+RS_EAT; x.fast=absMin()-x.at<15; x.self=!!self;
  if(!self){sfx('pop');floatText(L('Værsågod!','Enjoy!'));}
  if(S.scene==='restaurant') renderScene(true); save();
}
function rsDone(x){
  const tip=x.fast&&!x.self?4+S.restLvl*2:0;
  const special=x.dish==='hummer'?10:0;
  const pay=restPay(x.kind==='guest'?6+S.restLvl*3:10+S.restLvl*4)+tip*(S.restLvl>=6&&isEvening()?2:1)+special;
  addCoins(pay,S.scene!=='restaurant'); S.stats.served++; d_rsServed();
  if(x.kind==='guest'){const r=room(x.rid);const g=r&&r.guest;if(g){g.fed=true;if(g.wish==='mat')g.wishDone=true;}}
  if(S.scene==='restaurant'&&tip) setTimeout(()=>toast(L(`${x.name}: «Rask service! Her er litt tips.» +${tip}`,`${x.name}: “Quick service! Here’s a tip.” +${tip}`),'good'),50);
}
function d_rsServed(){const d=RSD();d.today=(d.day===S.day?d.today:0)+1;d.day=S.day;}
function tickResto(){
  const d=RSD(); const now=absMin(); let changed=false;
  const mp=mealPeriod();
  if(mp&&now>=(d.next||0)){ if(rsSpawn()) changed=true; d.next=now+Math.max(7,rnd(14,26)-S.restLvl*2); }
  if(tickWaiter()) changed=true;
  for(const x of d.d.slice()){
    if(x.state==='wait'){
      if(x.buffet&&now-x.at>=RS_SELF&&S.portions>0){rsServe(x.id,true);changed=true;continue;}
      const h=rsHearts(x); if(h!==x.h){x.h=h;changed=true;}
      if(now-x.at>RS_PATIENCE){d.d.splice(d.d.indexOf(x),1);changed=true;if(S.scene==='restaurant')toast(L(`${x.name} ga opp å vente og gikk.`,`${x.name} gave up waiting and left.`));}
    } else if(now>=x.until){d.d.splice(d.d.indexOf(x),1);rsDone(x);changed=true;}
  }
  if(!mp&&d.d.some(x=>x.state==='wait')){d.d=d.d.filter(x=>x.state!=='wait');changed=true;}
  return changed&&S.scene==='restaurant';
}
const rsHearts=x=>Math.max(1,3-Math.floor((absMin()-x.at)/(RS_PATIENCE/3)));

const CLEAN_MIN=20; // spillminutter per rom for ryddehjelpen
const floorName=f=>FLOORS[f].name?(S.lang==='en'?tr(FLOORS[f].name):FLOORS[f].name):L(f+'. etasje',['','1st','2nd','3rd'][f]?['','1st','2nd','3rd'][f]+' floor':f+'th floor');
const CLEAN_MULTI_STAR=5; // fra 5 stjerner: én ryddehjelp i hver etasje samtidig
const cleanersMany=()=>S.stars>=CLEAN_MULTI_STAR;
function cleanerStatus(f){
  const c=f==null?Object.values(S.cleaners)[0]:S.cleaners[f]; if(!c) return null;
  const done=Math.min(c.rooms.length,Math.floor((absMin()-c.start)/CLEAN_MIN));
  return {floor:c.floor,done,total:c.rooms.length,current:c.rooms[done]??null,pct:Math.min(100,(absMin()-c.start)/(CLEAN_MIN*c.rooms.length)*100)};
}
const cleanerOf=id=>{const c=Object.values(S.cleaners).find(c=>c.rooms.includes(id));return c?cleanerStatus(c.floor):null;};
const cleanerBusyElsewhere=f=>!cleanersMany()&&Object.keys(S.cleaners).some(k=>+k!==f);
function startCleaner(floor,roomIds){
  if(S.stars<CLEAN_STAR||S.cleaners[floor]||cleanerBusyElsewhere(floor)) return false;
  const ids=roomIds.filter(id=>{const r=room(id);return r&&r.dirty;});
  if(!ids.length) return false;
  if(!spend(ids.length*CLEAN_COST)) return false;
  S.cleaners[floor]={floor,rooms:ids,start:absMin()};
  sfx('click'); toast(L(`Ryddehjelpen er på vei til ${floorName(floor)} (${ids.length} rom).`,`The cleaner is on the way to the ${floorName(floor)} (${ids.length} room${ids.length>1?'s':''}).`));
  renderScene(true); refreshSheet(); save(); return true;
}
function startAllCleaners(){
  if(!cleanersMany()) return;
  const floors=[...new Set(S.rooms.filter(r=>r.dirty).map(r=>r.floor))].filter(f=>!S.cleaners[f]);
  let sent=0;
  for(const f of floors){const ids=S.rooms.filter(r=>r.floor===f&&r.dirty&&!cleanerOf(r.id)).map(r=>r.id);if(!ids.length)continue;if(S.coins<ids.length*CLEAN_COST)break;S.coins-=ids.length*CLEAN_COST;S.cleaners[f]={floor:f,rooms:ids,start:absMin()};sent++;}
  if(sent){sfx('click');toast(L(`${sent} ryddehjelp${sent>1?'ere':''} er på vei!`,`${sent} cleaner${sent>1?'s are':' is'} on the way!`));bumpHud('hCoins');}
  else toast(L('Du har ikke nok mynter til ryddehjelp.','You don’t have enough coins for cleaning help.'));
  renderScene(true); refreshSheet(); save();
}
function refundCleaner(id){
  const c=Object.values(S.cleaners).find(c=>c.rooms.includes(id)); if(!c) return; const i=c.rooms.indexOf(id);
  const done=Math.floor((absMin()-c.start)/CLEAN_MIN); if(i<done) return;
  c.rooms.splice(i,1); S.coins+=CLEAN_COST; toast(`Du ryddet rom ${id} selv – ryddehjelpen ga deg ${CLEAN_COST} mynter tilbake.`);
  if(!c.rooms.length) delete S.cleaners[c.floor];
}
function tickCleaner(){
  let changed=false;
  for(const c of Object.values(S.cleaners)){
    const done=Math.min(c.rooms.length,Math.floor((absMin()-c.start)/CLEAN_MIN));
    for(let i=0;i<done;i++){const r=room(c.rooms[i]); if(r&&r.dirty){r.dirty=false;r.mess=[];S.stats.cleaned++;changed=true;}}
    if(done>=c.rooms.length){
      delete S.cleaners[c.floor]; sfx('good');
      toast(cleanersMany()?L(`${floorName(c.floor)} er ren!`,`The ${floorName(c.floor)} is clean!`):L(`${floorName(c.floor)} er ren! Ryddehjelpen er klar for en ny etasje.`,`The ${floorName(c.floor)} is clean! The cleaner is ready for another floor.`),'good');
      checkQuests(); changed=true;
    }
  }
  return changed;
}

function starProgress(n){
  const q=STAR_REQ[n]; if(!q) return 100;
  const parts=starReqRows(n).map(([l,v,m])=>Math.min(1,v/m));
  return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length*100);
}

function checkout(r){
  const g=r.guest;if(!g||g.status!=='ready')return;const t=gtById(g.type);
  const c=comfort(r),stars=rateGuest(g,r),met=wishMet(g,r);
  let pay=Math.round((20+c*1.6+facBonus())*t.mult*(.6+stars*.12))+(met?15:0)+(g.fed?5:0);
  if(isEvening()&&S.fac.diskotek)pay+=6;
  addCoins(pay);addXP(8+stars*2);
  S.stats.checkouts++;S.dayLog.out++;if(stars>=3)S.stats.happy++;if(stars>=5)S.stats.five=(S.stats.five||0)+1;if(met)S.stats.wishes=(S.stats.wishes||0)+1;
  if(t.sol&&stars>=4)setTimeout(()=>addSol(t.sol),300);
  const lines=makeReview(g,r);
  const entry={name:g.name,type:g.type,stars,lines,day:S.day,room:r.id,look:g.look};
  S.guestbook.unshift(entry); if(S.guestbook.length>20) S.guestbook.length=20;
  reviewToast(entry,pay,t.sol&&stars>=4);
  r.guest=null;r.dirty=true;r.mess=genMess(rnd(3,5)+(stars<3?2:0));
  refreshSheet();renderScene(true);checkQuests();save();
}

  const rank=['bronse','solv','gull'];
  st.plays++; S.stats.games++; const newBest=score>st.best; if(newBest)st.best=score;
  if(m&&(!st.medal||rank.indexOf(m)>rank.indexOf(st.medal)))st.medal=m;
  const coins=Math.round(10+score*({pannekake:.06,bagasje:3,fiske:.4,strand:.45,kokk:.25,rydd:.45,dyr:.15,disko:.5,baat:.5,bowling:1,pepperkake:.4}[id])+(m?{bronse:10,solv:25,gull:50}[m]:0));
  addCoins(coins,true); addXP(10);
  let solTxt=''; if(m==='gull'&&!st.gold){st.gold=true;S.sol++;solTxt='<p class="tag ok">Første gull: +1 solstjerne!</p>';}
  const names={gull:'GULL',solv:'SØLV',bronse:'BRONSE'};
  $('#gbody').innerHTML=`<div class="result"><div class="bigmedal medal ${m||'ingen'}">${m?names[m]:'Øving'}</div><h3 style="font-size:24px">${score} ${g.unit}</h3>${newBest?'<p class="tag ok">Ny rekord!</p>':''}<p style="font-weight:800">Belønning: ${coins} mynter${extra}</p>${solTxt}<small class="muted" style="font-weight:700">Medaljer: bronse ${g.medals[0]} · sølv ${g.medals[1]} · gull ${g.medals[2]}</small><div class="row"><button class="btn blue" id="again">Spill igjen</button><button class="btn" id="done">Ferdig</button></div></div>`;
  $('#again').onclick=()=>{g.start();}; $('#done').onclick=closeGame;
  if(m){sfx('star');if(m==='gull')confetti();}else sfx('good');
  renderHUD(); checkQuests(); save();
}

/* PANNEKAKEMESTER */
function startPancake(){
  const lvl=gameLevel('pannekake'); let i=0,side=1,d=0,score=0,good=0,raf=0,last=0,waiting=false,pairOk=0;
  const speed=22+lvl*7;
  openGame('pannekake',`<div class="gstage"><div class="ginfo"><span>Pannekake <b id="pkN">1</b>/5</span><span>Side <b id="pkS">1</b></span><span>Poeng <b id="pkP">0</b></span></div>
   <div class="pan"><div class="pan-handle"></div><div class="pancake" id="pkC"></div></div>
   <div class="meter"><div class="zone"></div><div class="needle" id="pkM"></div></div>
   <p class="gmsg" id="pkMsg">Trykk «Snu!» når nålen er i det grønne feltet.</p>
   <button class="btn big" id="pkBtn">Snu!</button></div>`);
  const stops=[[0,[247,236,196]],[45,[243,207,122]],[70,[233,163,58]],[90,[176,100,42]],[110,[74,47,31]]];
  function col(v){for(let k=1;k<stops.length;k++){if(v<=stops[k][0]){const [a,ca]=stops[k-1],[b,cb]=stops[k];const t=(v-a)/(b-a);return `rgb(${ca.map((c,j)=>Math.round(c+(cb[j]-c)*t)).join(',')})`;}}return 'rgb(74,47,31)';}
  function frame(t){if(!last)last=t;const dt=Math.min(.05,(t-last)/1000);last=t;
    if(!waiting){d+=speed*dt*(side===2?1.12:1);const c=$('#pkC');if(!c)return;c.style.background=col(d);$('#pkM').style.left=Math.min(100,d/110*100)+'%';if(d>=110)flip(true);}
    raf=requestAnimationFrame(frame);}
  function flip(auto){
    if(waiting)return;
    const pts=auto?0:Math.max(0,Math.round(100-Math.abs(d-66)*4));
    score+=pts; if(pts>=50)pairOk++;
    const msg=pts>=90?'Perfekt! 🌟':pts>=60?'Gyllen!':pts>=30?'Helt ok …':d<66?'Litt rå …':'Oi, brent!';
    $('#pkMsg').textContent=`${msg} (+${pts})`; $('#pkP').textContent=score; sfx(pts>=60?'good':pts>=30?'pop':'bad');
    waiting=true; const c=$('#pkC'); c.classList.remove('flip'); void c.offsetWidth; c.classList.add('flip');
    setTimeout(()=>{if(!$('#pkC'))return;
      if(side===1){side=2;}else{side=1;i++;if(pairOk===2)good++;pairOk=0;}
      if(i>=5){cancelAnimationFrame(raf);finishGame('pannekake',score,` og ${good+1} porsjoner`);S.portions+=good+1;S.stats.cooked+=good+1;return;}
      d=0;$('#pkN').textContent=i+1;$('#pkS').textContent=side;waiting=false;},520);
  }
  $('#pkBtn').onclick=()=>flip(false);
  const key=e=>{if(e.code==='Space'){e.preventDefault();flip(false);}};
  addEventListener('keydown',key);
  raf=requestAnimationFrame(frame);
  gameCleanup=()=>{cancelAnimationFrame(raf);removeEventListener('keydown',key);};
}

/* BAGASJEKAOS */
function startLuggage(){
  const lvl=gameLevel('bagasje');
  const COLORS=[['#e0533f','Rød'],['#3d7fd1','Blå'],['#e7b416','Gul'],['#4fa35a','Grønn'],['#8a5cc4','Lilla'],['#ee86b6','Rosa']];
  const nums=[101,102,103,201,202,203];
  const n=Math.min(6,2+lvl); let doors=nums.slice(0,n).map((num,k)=>({num,c:COLORS[k][0]}));
  let time=30, score=0, cur=null, iv;
  openGame('bagasje',`<div class="gstage"><div class="ginfo"><span>Tid <b id="lgT">30</b></span><span>Riktige <b id="lgS">0</b></span></div>
   <p class="muted" style="font-weight:700">${lvl>=3?'Les romnummeret på lappen!':'Send kofferten til døra med samme farge og nummer.'}</p>
   <div class="suitcase" id="lgBag"><span class="stag" id="lgTag">101</span></div>
   <div class="doorbtns" id="lgDoors"></div></div>`);
  function drawDoors(){$('#lgDoors').innerHTML=doors.map(d=>`<button class="doorbtn" style="background:${d.c}" data-n="${d.num}">${d.num}</button>`).join('');}
  function next(){cur=pick(doors);const bag=$('#lgBag');bag.style.background=lvl>=3?'#a8733f':cur.c;$('#lgTag').textContent=cur.num;bag.style.animation='none';void bag.offsetWidth;bag.style.animation='';
    if(lvl>=4){doors=doors.sort(()=>Math.random()-.5);drawDoors();}}
  drawDoors(); next();
  $('#lgDoors').onclick=e=>{const b=e.target.closest('.doorbtn');if(!b)return;
    if(+b.dataset.n===cur.num){score++;$('#lgS').textContent=score;sfx('coin');b.classList.remove('flash-good');void b.offsetWidth;b.classList.add('flash-good');next();}
    else{time=Math.max(0,time-2);sfx('bad');$('#lgBag').classList.remove('flash-bad');void $('#lgBag').offsetWidth;$('#lgBag').classList.add('flash-bad');}};
  iv=setInterval(()=>{time-=.1;const t=$('#lgT');if(t)t.textContent=Math.max(0,Math.ceil(time));if(time<=0){clearInterval(iv);finishGame('bagasje',score);}},100);
  gameCleanup=()=>clearInterval(iv);
}

/* FISKELYKKE */
function startFishing(){
  const lvl=gameLevel('fiske'); const win=Math.max(380,950-lvl*120);
  let cast=0,score=0,state='wait',timers=[],caught=[];
  openGame('fiske',`<div class="gstage"><div class="ginfo"><span>Kast <b id="fsC">1</b>/8</span><span>Poeng <b id="fsP">0</b></span></div>
   <div class="pond" id="fsPond"><div class="line"></div><div class="ripple"></div><div class="bobber" id="fsB"></div><div id="fsCatch"></div></div>
   <p class="gmsg" id="fsMsg">Vent på napp …</p><button class="btn big" id="fsBtn">Dra opp!</button></div>`);
  const T=(f,ms)=>timers.push(setTimeout(f,ms));
  function startCast(){state='wait';$('#fsMsg').textContent='Vent på napp …';$('#fsB').classList.remove('bite');$('#fsCatch').innerHTML='';
    T(()=>{if(state!=='wait')return;state='bite';$('#fsB').classList.add('bite');$('#fsMsg').textContent='NAPP! Dra opp!';sfx('ding');
      T(()=>{if(state==='bite'){state='done';$('#fsB').classList.remove('bite');$('#fsMsg').textContent='Fisken stakk av …';sfx('bad');nextCast();}},win);},rnd(1000,3400));}
  function nextCast(){cast++;if(cast>=8){T(()=>{S.stats.fish+=caught.length;caught.forEach(id=>{if(!S.col.fisk.includes(id))S.col.fisk.push(id);});finishGame('fiske',score,` og ${caught.length} fisk`);},900);return;}T(()=>{$('#fsC').textContent=cast+1;startCast();},1100);}
  function pull(){
    if(state==='wait'){state='done';$('#fsMsg').textContent='For tidlig! Fisken skvatt.';sfx('bad');nextCast();return;}
    if(state!=='bite')return;
    state='done';const pool=[];FISH.forEach(f=>{for(let k=0;k<f.w+(f.id==='glimt'?lvl:0);k++)pool.push(f);});const f=pick(pool);
    score+=f.p;caught.push(f.id);$('#fsP').textContent=score;$('#fsB').classList.remove('bite');
    $('#fsCatch').innerHTML=`<span class="catch" style="filter:hue-rotate(${f.h}deg)${f.id==='glimt'?' sepia(.8) saturate(3)':''}">${f.e}</span>`;
    $('#fsMsg').textContent=`Du fikk en ${f.name}! +${f.p}`;sfx(f.id==='glimt'?'star':'good');nextCast();}
  $('#fsBtn').onclick=pull; $('#fsPond').onclick=pull;
  startCast();
  gameCleanup=()=>timers.forEach(clearTimeout);
}

/* STRANDSKATTER */
function startBeach(){
  const lvl=gameLevel('strand'); const inVika=S.scene==='area:glimtvika';
  const cols=6,rows=5; let digs=Math.max(9,15-lvl); const nT=6+(lvl>2?1:0);
  const cells=Array.from({length:cols*rows},()=>({it:null,dug:false}));
  const idx=[...cells.keys()].sort(()=>Math.random()-.5).slice(0,nT);
  idx.forEach(i=>{const r=Math.random();let it;
    if(r<(inVika?.18:.06))it={k:'gull',e:'🐚',p:60,name:'Gullskjell'};
    else if(r<.62){const s=pick(SHELLS);it={k:'skjell',id:s.id,e:'🐚',h:s.h,p:20,name:s.name};}
    else if(r<.86)it={k:'mynt',e:'💰',p:15,name:'Myntpung'};
    else it={k:'krabbe',e:'🦀',p:0,name:'Krabbe'};
    cells[i].it=it;});
  let score=0,found=0,newShells=[];
  openGame('strand',`<div class="gstage"><div class="ginfo"><span>Spadetak <b id="bdD">${digs}</b></span><span>Poeng <b id="bdP">0</b></span><span>Skatter <b id="bdF">0</b>/${nT}</span></div>
   <p class="muted" style="font-weight:700">Tallet viser hvor mange skatter som ligger rett ved siden av.</p>
   <div class="sandgrid" id="bdG"></div><p class="gmsg" id="bdMsg"></p></div>`);
  const near=i=>{const x=i%cols,y=Math.floor(i/cols);let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=cols||ny>=rows)continue;const c=cells[ny*cols+nx];if(c.it&&!c.dug)n++;}return n;};
  const draw=(reveal)=>{$('#bdG').innerHTML=cells.map((c,i)=>{
    if(c.dug)return `<button class="sand dug" disabled>${c.it?`<span style="${c.it.h!=null?`filter:hue-rotate(${c.it.h}deg)`:c.it.k==='gull'?'filter:sepia(1) saturate(4)':''}">${c.it.e}</span>`:(c.n||'')}</button>`;
    if(reveal&&c.it)return `<button class="sand ghost" disabled>${c.it.e}</button>`;
    return `<button class="sand" data-i="${i}" aria-label="Grav"></button>`;}).join('');};
  draw();
  $('#bdG').onclick=e=>{const b=e.target.closest('.sand[data-i]');if(!b||digs<=0)return;const i=+b.dataset.i;const c=cells[i];c.dug=true;digs--;
    if(c.it){found++;score+=c.it.p;
      if(c.it.k==='skjell'&&!S.col.skjell.includes(c.it.id)){S.col.skjell.push(c.it.id);newShells.push(c.it.name);}
      if(c.it.k==='gull')giveRare('gullskjell');
      $('#bdMsg').textContent=c.it.k==='krabbe'?'Au! En krabbe kniper deg i tåa.':`Du fant: ${c.it.name}! +${c.it.p}`;sfx(c.it.k==='krabbe'?'bad':'coin');}
    else{c.n=near(i);$('#bdMsg').textContent=c.n?`${c.n} skatt${c.n>1?'er':''} i nærheten …`:'Bare sand her.';sfx('poof');}
    cells.forEach((cc,j)=>{if(cc.dug&&!cc.it)cc.n=near(j);});
    $('#bdD').textContent=digs;$('#bdP').textContent=score;$('#bdF').textContent=found;draw();
    if(digs<=0||found>=nT){draw(true);setTimeout(()=>finishGame('strand',score,newShells.length?` · nye skjell: ${newShells.join(', ')}`:''),1100);}};
  gameCleanup=null;
}
